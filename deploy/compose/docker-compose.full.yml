# LiveCore FULL LOCAL STACK overlay — Docker Compose (CORE-DEP-006).
#
# The minimal stack (docker-compose.yml) deliberately ships only postgres +
# migrate + api + worker, with the OIDC, object-storage and realtime-backplane
# seams UNSET so it comes up green with no external services. That is the right
# default for a small self-hosting deployment, but it means nobody can run an
# AUTHENTICATED, ASSET-SERVING, SCALE-OUT Core locally out of the box.
#
# This OVERLAY adds the three supporting services the Core integrates with and
# PRE-WIRES the api/worker to them, so an operator or a vertical author can run
# the platform end-to-end on one machine without standing anything up by hand:
#
#   keycloak    — an OIDC provider (docs/02 "Auth: Keycloak for local/self-hosted
#                 auth"). Imports the bundled `livecore` realm (an API-audience
#                 client, a public client with an audience mapper and a demo user),
#                 so the api validates real bearer tokens — authenticated traffic.
#   rustfs      — S3-compatible object storage (docs/02 "Storage: RustFS"), the
#                 Apache-2.0-licensed default object store. Private buckets only; the
#                 api/worker mint short-lived signed URLs against it — asset
#                 upload/download.
#   rustfs-setup— a one-shot job (the AWS CLI, an S3-standard client) that waits for
#                 RustFS, creates the private `livecore-assets` bucket and exits 0. The
#                 api/worker gate on its completion, so the bucket always exists before
#                 they start.
#   valkey      — a Redis/Valkey realtime backplane (docs/02 "Valkey or Redis-
#                 compatible backplane for realtime scale-out"). The api publishes
#                 SignalR group sends through it, so a delivery reaches connections
#                 on EVERY api instance — multi-instance realtime (scale with
#                 `docker compose ... up --scale api=N` behind a sticky proxy).
#
# IT IS A SEPARATE, OPT-IN OVERLAY so the minimal stack stays minimal: it is
# merged ON TOP of the base manifest only when you ask for it —
#
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up -d --build
#
# A plain `docker compose up` (base file only) is unchanged and adds none of these
# services. The overlay REUSES THE DOCUMENTED CONFIG CONTRACT (CORE-OPS-008): it
# only fills the same `Authentication__Oidc__*` / `Assets__Storage__*` /
# `Realtime__Backplane__*` env keys the base manifest already exposes (unset there),
# and it inherits the base migrate-before-API gate and the published probe ports
# untouched. Every supporting-service knob has a safe LOCAL default, documented in
# deploy/compose/.env.example ("Full local stack"); override them in `.env`.
#
# LOCAL DEVELOPMENT POSTURE. The bundled credentials/admin accounts below are
# well-known LOCAL defaults for a throwaway machine, not production secrets — the
# same posture as the base stack's `livecore`/`livecore` PostgreSQL login. Harden
# them (and the OIDC realm) before exposing this anywhere; see deploy/compose/README.md.
# The OIDC issuer is the IN-NETWORK url `http://keycloak:8080/realms/livecore`, so a
# vertical app that obtains tokens should run in this compose network and use that
# authority; Keycloak's admin console is published on the host for management only.
name: livecore

services:
  # --- OIDC provider (authenticated traffic) ---
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.1}
    # Dev mode: HTTP enabled, relaxed hostname, issuer follows the request host
    # (so the in-network http://keycloak:8080 issuer matches the api authority
    # below). --import-realm loads the bundled realm from the mounted file.
    command: ["start-dev", "--import-realm"]
    environment:
      # Bootstrap admin for the console only (the realm + clients come from the
      # imported file; the discovery endpoint the api reads is public).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realm-livecore.json:/opt/keycloak/data/import/realm-livecore.json:ro
    ports:
      # Admin console / human token testing on the host (in-network auth uses
      # http://keycloak:8080 directly — see the issuer note in the header).
      - "${LIVECORE_KEYCLOAK_PORT:-8081}:8080"
    restart: unless-stopped

  # --- S3-compatible object storage (asset upload/download) ---
  # RustFS is an Apache-2.0-licensed, S3-compatible object store — the default backend
  # the api/worker S3CompatibleAssetStorage adapter signs against (ADR 0006 keeps the
  # contract any-S3-compatible). Pinned by digest for supply-chain reproducibility
  # (CORE-DEP-003). It runs as the non-root `rustfs` user (uid 10001) and the image
  # owns /data, so the named volume below inherits that ownership and stays writable.
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.0-beta.8@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3}
    environment:
      # The root S3 login the api/worker reuse as Assets__Storage__AccessKeyId/Secret.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      # Single-node volume + bind addresses for the S3 API and the web console.
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - livecore-rustfs-data:/data
    ports:
      - "${LIVECORE_RUSTFS_PORT:-9000}:9000"
      - "${LIVECORE_RUSTFS_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  # One-shot: wait for RustFS, create the PRIVATE assets bucket, exit 0. The api/worker
  # depend on it with service_completed_successfully, so the bucket the signed-URL
  # adapter writes to always exists before they start (mirrors the migrate gate's
  # run-before-then-start pattern). It bootstraps with the AWS CLI (Apache-2.0, an
  # S3-standard client) rather than a vendor-specific tool, so the whole storage stack
  # stays off AGPL tooling — the point of the RustFS move. S3/RustFS buckets are PRIVATE
  # by default (no public access without an explicit policy), so no anonymous-access
  # toggle is needed; create-bucket is not idempotent, so a re-run falls back to
  # head-bucket when the bucket already exists.
  rustfs-setup:
    image: ${RUSTFS_SETUP_IMAGE:-amazon/aws-cli:2.35.8@sha256:14b197d682f59240b51c3953a3a47b19288dbbb25c2e237fc6eb2d70e8fca227}
    environment:
      # The AWS CLI reads these standard vars automatically; they are the RustFS login.
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${Assets__Storage__Region:-us-east-1}
      LIVECORE_ASSET_BUCKET: ${Assets__Storage__Bucket:-livecore-assets}
    depends_on:
      rustfs:
        condition: service_started
    # $$ escapes Compose interpolation so the container shell expands the bucket name.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until aws --endpoint-url "http://rustfs:9000" s3 ls >/dev/null 2>&1; do
          echo "waiting for object storage..."; sleep 2;
        done
        aws --endpoint-url "http://rustfs:9000" s3api create-bucket --bucket "$$LIVECORE_ASSET_BUCKET" || aws --endpoint-url "http://rustfs:9000" s3api head-bucket --bucket "$$LIVECORE_ASSET_BUCKET"
        echo "object storage ready: private bucket $$LIVECORE_ASSET_BUCKET"
    restart: "no"

  # --- Realtime scale-out backplane (multi-instance realtime) ---
  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:8}
    # Ephemeral cache/backplane: no persistence needed for realtime fan-out.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${LIVECORE_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- Pre-wire the API to all three supporting services ---
  # Compose MERGES this into the base `api`: these env keys override the base's
  # unset defaults, and these depends_on entries are added to the base postgres +
  # migrate gate (so the gate is preserved untouched).
  api:
    environment:
      # OIDC active (an Authority is configured), so authenticated routes validate
      # real bearer tokens against Keycloak. RequireHttpsMetadata=false allows the
      # local http issuer; the Audience must match the realm's audience mapper.
      Authentication__Oidc__Authority: ${Authentication__Oidc__Authority:-http://keycloak:8080/realms/livecore}
      Authentication__Oidc__Audience: ${Authentication__Oidc__Audience:-livecore-api}
      Authentication__Oidc__RequireHttpsMetadata: ${Authentication__Oidc__RequireHttpsMetadata:-false}
      # Object storage wired to RustFS (path-style is required for S3-compatible
      # self-hosted backends). The access key/secret reuse the RustFS root login.
      Assets__Storage__Endpoint: ${Assets__Storage__Endpoint:-http://rustfs:9000}
      Assets__Storage__AccessKeyId: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      Assets__Storage__SecretAccessKey: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      Assets__Storage__Region: ${Assets__Storage__Region:-us-east-1}
      Assets__Storage__ForcePathStyle: ${Assets__Storage__ForcePathStyle:-true}
      Assets__Storage__Bucket: ${Assets__Storage__Bucket:-livecore-assets}
      # Realtime backplane wired to Valkey (StackExchange.Redis connection string),
      # so multiple api instances fan realtime out to every connection.
      Realtime__Backplane__ConnectionString: ${Realtime__Backplane__ConnectionString:-valkey:6379}
    depends_on:
      keycloak:
        condition: service_started
      valkey:
        condition: service_healthy
      rustfs-setup:
        condition: service_completed_successfully

  # --- Pre-wire the worker to object storage ---
  # The asset-cleanup loop deletes the objects of abandoned upload intents, so it
  # shares the same storage configuration as the api.
  worker:
    environment:
      Assets__Storage__Endpoint: ${Assets__Storage__Endpoint:-http://rustfs:9000}
      Assets__Storage__AccessKeyId: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      Assets__Storage__SecretAccessKey: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      Assets__Storage__Region: ${Assets__Storage__Region:-us-east-1}
      Assets__Storage__ForcePathStyle: ${Assets__Storage__ForcePathStyle:-true}
      Assets__Storage__Bucket: ${Assets__Storage__Bucket:-livecore-assets}
    depends_on:
      rustfs-setup:
        condition: service_completed_successfully

volumes:
  # Named volume so the object store survives `docker compose down` (use
  # `docker compose down -v` to discard it alongside the database volume).
  livecore-rustfs-data:
