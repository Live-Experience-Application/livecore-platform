# Default values for the LiveCore chart (CORE-DEP-004).
#
# Every setting below is overridable with `-f my-values.yaml` or `--set`. The
# documented configuration contract (CORE-OPS-008, docs/13) is split into a
# non-secret `config` map (rendered into a ConfigMap) and a `secrets` map
# (rendered into a Secret). NO SECRET IS BAKED INTO THE CHART: every secret value
# below is empty — supply real values at install time, or point `secrets.existingSecret`
# at a Secret you manage out of band (e.g. from an external secret store / sealed
# secret). See deploy/helm/livecore/README.md.

# -- Override the chart name / fully-qualified name.
nameOverride: ""
fullnameOverride: ""

image:
  # -- Container registry the component images are pulled from. Set to "" to use
  # bare repository references (a local image, or a registry baked into the repo).
  registry: ghcr.io
  # -- Shared image tag. Empty falls back to the chart appVersion. Pin this to the
  # released container version you deploy (CORE-OPS-009).
  tag: ""
  pullPolicy: IfNotPresent

# -- References to Secrets holding registry credentials, e.g. [{ name: regcred }].
imagePullSecrets: []

serviceAccount:
  # -- Create a dedicated ServiceAccount for the workloads.
  create: true
  # -- Name to use; generated from the release name when empty.
  name: ""
  annotations: {}

# -- Pod-level security context (a hardened, non-root baseline matching the images,
# which run as the non-root APP_UID — apps/api/Dockerfile).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. readOnlyRootFilesystem is paired with a
# writable /tmp emptyDir mounted into each container below.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Non-secret configuration -> ConfigMap, projected into every container via
# envFrom. Add any other documented key (.env.example / docs/13) here.
config:
  # The bundled chart targets a real production deployment, so it defaults to
  # Production. In Production the API fails closed and reports not-ready until the
  # database and OIDC values are supplied (CORE-OPS-004 / CORE-OPS-005).
  ASPNETCORE_ENVIRONMENT: "Production"
  # [prod-required] OIDC issuer/audience the API validates access tokens against.
  Authentication__Oidc__Authority: ""
  Authentication__Oidc__Audience: ""
  # Public host(s) the API answers to, as the host-header allow-list (semicolon-separated).
  # Secure by default (CORE-SEC-010): the ConfigMap NEVER renders this empty — ASP.NET Core
  # treats an empty AllowedHosts as allow-all ("*" — host-header validation OFF). The rendered
  # value is the host(s) you set here JOINED with the loopback hosts (localhost;127.0.0.1) the
  # in-pod liveness/readiness probes send their Host header as, so a restrictive allow-list still
  # admits the kubelet probes (templates/_helpers.tpl "livecore.allowedHosts"). Left empty it
  # renders just the loopback hosts, so host filtering is ON by default and an unexpected Host is
  # rejected; set your real ingress host(s) (e.g. "app.example.com") for production traffic.
  AllowedHosts: ""
  # Browser/PWA origin(s) allowed to call the API and the SignalR hub (indexed list).
  Cors__AllowedOrigins__0: ""
  # The trusted forwarding proxy in front of the API (CORE-OPS-003). Behind a load balancer /
  # ingress set the proxy's pod network (CIDR) here — and/or ForwardedHeaders__KnownProxies__0 for
  # a fixed proxy IP — so UseForwardedHeaders restores the real client scheme/host/IP from the
  # X-Forwarded-* headers. REQUIRED behind a load balancer (CORE-SEC-010): without a trusted
  # proxy/network the API sees the PROXY's IP as the client, so the anonymous per-IP rate-limit
  # partition (RateLimitingConfiguration) collapses to a SINGLE bucket — every anonymous client
  # shares one limit, so one flood throttles all of them and no caller is isolated. In Kubernetes
  # the ingress pod IP is not fixed, so a CIDR network is the usual choice.
  ForwardedHeaders__KnownNetworks__0: ""
  # S3-compatible object storage endpoint for asset binaries (credentials are secrets).
  Assets__Storage__Endpoint: ""
  # The worker's metrics/health listen URL (GET /metrics + GET /health/live, CORE-DR-003).
  Worker__Metrics__Url: "http://0.0.0.0:9464"
  # Bounded database connection pool per process (Npgsql Maximum Pool Size, CORE-DEP-014).
  # Npgsql defaults an unset pool to 100 connections PER PROCESS, so without a cap scaling
  # api.replicaCount (or enabling autoscaling) could silently exhaust PostgreSQL's
  # max_connections (default 100). This value applies to BOTH the API and the worker (the
  # shared ConfigMap), so keep the CONNECTION BUDGET below at or under max_connections:
  #
  #   (api.replicaCount + worker.replicaCount) * Persistence__MaxPoolSize  <=  max_connections
  #
  # Worked example (the shipped defaults): (1 api + 1 worker) * 20 = 40 connections, well
  # under the default max_connections of 100. Scaling the API to 4 replicas would need
  # (4 + 1) * 20 = 100 = max_connections with NO headroom for the transient migrate Job or
  # PostgreSQL's reserved connections — so when you raise api.replicaCount, LOWER this value
  # (e.g. 15) or raise the database's max_connections. An explicit "Maximum Pool Size=<N>"
  # in ConnectionStrings__Database always wins over this key. See docs/13
  # ("Database connection tuning"). Core also applies this bounded default in code, so the
  # pool is bounded even if this key is removed.
  Persistence__MaxPoolSize: "20"

# Secret configuration -> Secret (type Opaque, stringData), projected via envFrom.
# EMPTY BY DEFAULT — no secret is committed in the chart. Supply at install time or
# set existingSecret to project a Secret you manage out of band.
secrets:
  # -- Name of an existing Secret to project instead of rendering one from the keys
  # below. When set, the chart renders NO Secret of its own.
  existingSecret: ""
  # [secret][prod-required] PostgreSQL connection string (carries the DB password).
  # The migrations runner, the API and the worker all read this same key. The connection
  # pool is bounded by config.Persistence__MaxPoolSize across replicas (CORE-DEP-014); an
  # explicit "Maximum Pool Size=<N>" here overrides it (CORE-RES-004).
  ConnectionStrings__Database: ""
  # [secret] S3-compatible object-storage credentials (asset binaries).
  Assets__Storage__AccessKeyId: ""
  Assets__Storage__SecretAccessKey: ""
  # [secret] Redis/Valkey backplane connection string — required only when running
  # more than one API replica (CORE-OPS-007).
  Realtime__Backplane__ConnectionString: ""

# The migrations runner — a one-shot Job run as a pre-install/pre-upgrade hook that
# must succeed BEFORE the API and worker roll out. This is the Helm form of the
# Compose migrate-before-API gate (docs/13, "Gating the API rollout").
migrations:
  enabled: true
  image:
    # The migrations runner image (apps/api/Migrations.Dockerfile). Build and push
    # it to a registry your cluster can pull (docs/13 shows the build command).
    repository: live-experience-application/livecore-migrations
    tag: ""
  # Helm hook weight; the migrate Job runs before the rest of the release.
  hookWeight: -5
  # Bounded retries; the runner is idempotent (re-running applies nothing, exits 0).
  backoffLimit: 3
  restartPolicy: Never
  annotations: {}
  podAnnotations: {}
  # Resource requests and limits (CORE-DEP-007 / CORE-DEP-010). The Kubernetes path
  # enforces the SAME ceiling as the Compose stack so a runaway pod cannot starve the
  # node. `requests` reserve the docs/13 "minimum" sizing for scheduling; `limits`
  # cap at the docs/13 "recommended" ceiling (the shipped Compose default). The
  # migrate Job is a short-lived, one-shot schema runner, so it gets the smallest
  # ceiling. Override any field with -f/--set; set resources to {} to remove it.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  # Default to a SINGLE API replica (CORE-DEP-009). Running more than one API replica
  # REQUIRES the realtime backplane (secrets.Realtime__Backplane__ConnectionString,
  # CORE-OPS-007) AND sticky sessions at the ingress (CORE-DEP-002): SignalR tracks
  # hub-group membership per process, so a reveal computed on one pod is silently
  # dropped for clients connected to the others when no shared backplane is configured.
  # To stop a default install silently running multiple pods on the in-process
  # backplane, the chart FAILS TO RENDER when replicaCount > 1 and no backplane is
  # configured (templates/_helpers.tpl "livecore.validateRealtimeBackplane"). Raise this
  # only together with secrets.Realtime__Backplane__ConnectionString (or an existingSecret
  # that carries it) and ingress sticky sessions.
  replicaCount: 1
  image:
    repository: live-experience-application/livecore-api
    tag: ""
  # Kestrel listens on the unprivileged container port 8080 (apps/api/Dockerfile).
  containerPort: 8080
  # Liveness — restart on failure (the documented unauthenticated probe, docs/13).
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
      # The kubelet probes the pod IP, but the API enforces the AllowedHosts host filter
      # (CORE-SEC-010), which never matches the dynamic pod IP. Send a loopback Host header —
      # localhost is always in the rendered AllowedHosts — so the probe is admitted under the
      # secure-by-default host filter. (Set in httpHeaders, not httpGet.host, so the kubelet
      # still connects to the pod IP and only the Host header is overridden.)
      httpHeaders:
        - name: Host
          value: localhost
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # Readiness — route traffic only while passing (CORE-OPS-005). Fails closed until
  # the database and OIDC are configured and reachable (CORE-OBS-009).
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
      # Loopback Host header for the host filter (CORE-SEC-010); see livenessProbe above.
      httpHeaders:
        - name: Host
          value: localhost
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # Resource requests and limits (CORE-DEP-007 / CORE-DEP-010), mirroring the Compose
  # api ceiling (deploy/compose/docker-compose.yml: 1.0 vCPU / 1024 MB). `requests`
  # reserve the docs/13 minimum (0.5 vCPU / 512 MB) for scheduling; `limits` cap at
  # the recommended ceiling so a runaway API pod cannot starve the node — the exact
  # failure CORE-DEP-007 prevents on Compose. Overridable per field with -f/--set.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Keep at or above the host graceful-shutdown drain window (CORE-DEP-002).
  terminationGracePeriodSeconds: 30
  # PodDisruptionBudget for the API (CORE-DEP-012). A voluntary disruption — a node drain
  # (cordon/drain for a kernel patch) or a rolling node-pool upgrade — evicts pods through
  # the Eviction API, which honours PodDisruptionBudgets. Without one, draining a node can
  # evict EVERY API replica at once; at replicaCount 2 that is a full API outage. The PDB
  # caps how many API pods a voluntary disruption may take down at once so at least one
  # keeps serving. It is rendered ONLY when the API can run more than one pod
  # (api.replicaCount > 1 OR autoscaling.enabled, CORE-DEP-011): at the single-replica
  # default it renders NOTHING, because a PDB over a lone pod would block its node from
  # ever draining — the chart's "safe at replicaCount 1" behaviour (templates/api-pdb.yaml).
  podDisruptionBudget:
    # Render the PDB (when the multi-pod condition above holds). Set to false to ship none.
    enabled: true
    # The budget. The default maxUnavailable: 1 lets a voluntary disruption take at most
    # one API pod at a time, so at least replicaCount-1 (>= 1) stay available. Set
    # minAvailable instead for an absolute floor (e.g. minAvailable: 2); a PDB carries
    # exactly one of the two, and minAvailable wins when both are set.
    maxUnavailable: 1
    minAvailable: null
  service:
    type: ClusterIP
    port: 80

# Optional HorizontalPodAutoscaler for the API Deployment (CORE-DEP-011). DISABLED by
# default: a default install ships NO HPA and the API runs at api.replicaCount (1). When
# enabled the chart renders an autoscaling/v2 HorizontalPodAutoscaler (templates/api-hpa.yaml)
# that targets the API Deployment and scales it between minReplicas and maxReplicas to hold
# the CPU/memory utilization targets below — the automated mechanism behind the documented
# horizontal-scaling guidance (docs/13, "When to add API replicas"). The Deployment's static
# replicas field is omitted while autoscaling is enabled so the HPA owns the replica count.
#
# Enabling autoscaling IMPLIES the multi-replica realtime requirement (CORE-DEP-009): an HPA
# can scale the API past one pod, and SignalR tracks hub-group membership per process, so a
# reveal computed on one pod is silently dropped for clients on another unless a shared
# backplane is configured (CORE-OPS-007). So the chart FAILS TO RENDER when autoscaling is
# enabled and no backplane (secrets.Realtime__Backplane__ConnectionString, or an existingSecret
# that carries it) is configured — the SAME guard CORE-DEP-009 applies to api.replicaCount > 1
# (templates/_helpers.tpl "livecore.validateRealtimeBackplane"). Enable it only together with
# the backplane AND ingress sticky sessions (CORE-DEP-002 / CORE-DEP-013).
autoscaling:
  enabled: false
  # Replica bounds the HPA keeps the API Deployment within.
  minReplicas: 2
  maxReplicas: 5
  # Target average CPU utilization (percent of the api.resources.requests.cpu above) the HPA
  # holds the API at by scaling. Set to null to omit the CPU metric.
  targetCPUUtilizationPercentage: 75
  # Target average memory utilization (percent of api.resources.requests.memory). Set to null
  # to omit the memory metric. At least one of the two targets must be set when enabled.
  targetMemoryUtilizationPercentage: 80

worker:
  replicaCount: 1
  image:
    repository: live-experience-application/livecore-worker
    tag: ""
  # The worker's metrics/health HTTP port (CORE-DR-003); it serves no app traffic.
  metricsPort: 9464
  # Per-loop heartbeat liveness — restart when a job loop hangs (CORE-DR-003). The
  # worker takes no inbound traffic, so it has no readiness probe.
  livenessProbe:
    httpGet:
      path: /health/live
      port: metrics
      # The worker's metrics/health host shares the ConfigMap AllowedHosts (envFrom), so it
      # enforces the same host filter (CORE-SEC-010). Send a loopback Host header so the probe
      # is admitted; see api.livenessProbe above.
      httpHeaders:
        - name: Host
          value: localhost
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  # Resource requests and limits (CORE-DEP-007 / CORE-DEP-010), mirroring the Compose
  # worker ceiling (0.75 vCPU / 768 MB). The worker runs a handful of background
  # loops, so it reserves/caps smaller than the API: `requests` = the docs/13 minimum
  # (0.25 vCPU / 384 MB), `limits` = the recommended ceiling. Overridable.
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 750m
      memory: 768Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30
  # PodDisruptionBudget for the worker (CORE-DEP-012), symmetric with the API's. Rendered
  # ONLY when worker.replicaCount > 1 (the worker has no autoscaler); the single-worker
  # default renders nothing, so a node drain of the lone worker is never blocked. A
  # voluntary disruption then takes at most maxUnavailable worker pods down at once. Set
  # minAvailable for an absolute floor, or enabled: false to ship none.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: null

ingress:
  enabled: false
  className: ""
  # Operator-supplied annotations, merged onto the rendered Ingress verbatim. These win
  # over the sticky-session affinity defaults below on a key conflict.
  annotations: {}
  # SignalR sticky-session affinity for a multi-replica API (CORE-DEP-002 / CORE-DEP-013).
  # A SignalR connection starts with a negotiate request that issues a connectionId; the
  # non-WebSocket fallbacks (SSE, long polling) then make follow-up requests that MUST all
  # reach the replica that issued it. The hub keeps the full transport set (it does not
  # force WebSockets-only), so a multi-replica API needs each client pinned to one replica.
  # When `enabled` is true (the default) AND api.replicaCount > 1, the chart renders the
  # `annotations` below onto the Ingress automatically; at the default single replica it
  # renders nothing, so the single-replica path is unaffected. The defaults are nginx-ingress
  # cookie affinity in persistent mode (so a scale event does not silently re-balance an open
  # SignalR connection). Override `annotations` for a different ingress controller, or set
  # `enabled: false` to opt out (e.g. a client that forces a WebSockets-only transport).
  sessionAffinity:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/affinity-mode: "persistent"
      nginx.ingress.kubernetes.io/session-cookie-name: "livecore-affinity"
  hosts:
    - host: livecore.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
