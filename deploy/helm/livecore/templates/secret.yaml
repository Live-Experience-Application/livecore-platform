{{- if not .Values.secrets.existingSecret }}
# Secret configuration (CORE-OPS-008, threat T7). NO SECRET IS BAKED INTO THE
# CHART: the values default to empty in values.yaml and must be supplied at install
# time (or replaced wholesale with secrets.existingSecret). Projected via envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "livecore.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "livecore.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := omit .Values.secrets "existingSecret" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
