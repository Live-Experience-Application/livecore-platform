# The API host Deployment. Rolled out only AFTER the pre-install/pre-upgrade
# migrate Job succeeds (see migrate-job.yaml). Wires the documented unauthenticated
# liveness (/health/live) and readiness (/health/ready) probes (docs/13).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "livecore.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "livecore.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "livecore.componentSelectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "livecore.componentSelectorLabels" (dict "root" $ "component" "api") | nindent 8 }}
      annotations:
        # Roll the pods when the projected configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "livecore.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "livecore.componentImage" (dict "root" $ "component" .Values.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: {{ .Values.api.containerPort | quote }}
          envFrom:
            {{- include "livecore.envFrom" . | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
