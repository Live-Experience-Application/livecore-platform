{{- if .Values.ingress.enabled }}
# Optional Ingress to the API Service. Core does not terminate TLS itself
# (CORE-OPS-003): terminate it at the ingress and forward the original
# scheme/host/IP (set config.ForwardedHeaders__KnownNetworks__0 to the ingress pod
# network).
#
# SignalR sticky-session affinity (CORE-DEP-002 / CORE-DEP-013). A multi-replica API
# (api.replicaCount > 1) serving SignalR needs each client's negotiate + transport
# handshake pinned to the replica that issued its connectionId — the hub keeps the full
# transport set (it does NOT force WebSockets-only), so the non-WebSocket fallbacks make
# follow-up requests that must all reach that same replica. When ingress.sessionAffinity
# is enabled (the default) AND api.replicaCount > 1, the chart MERGES the cookie-affinity
# annotations (ingress.sessionAffinity.annotations) onto this Ingress automatically; at
# the default single replica it adds nothing, so the single-replica path is unaffected.
# Operator-supplied .Values.ingress.annotations win on a key conflict. Set
# ingress.sessionAffinity.enabled=false to opt out (a WebSockets-only client transport, or
# a non-nginx controller you annotate yourself through ingress.annotations).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "livecore.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "livecore.labels" . | nindent 4 }}
  {{- $annotations := deepCopy .Values.ingress.annotations }}
  {{- if and .Values.ingress.sessionAffinity.enabled (gt (int .Values.api.replicaCount) 1) }}
  {{- $annotations = merge $annotations .Values.ingress.sessionAffinity.annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- $fullName := include "livecore.fullname" . }}
    {{- $svcPort := .Values.api.service.port }}
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullName }}-api
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
