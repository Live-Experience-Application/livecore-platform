{{- /*
PodDisruptionBudget for the worker Deployment (CORE-DEP-012), symmetric with the API's.
The worker serves no inbound traffic, but a voluntary disruption (node drain / upgrade)
that evicts every worker pod at once still stalls the background job loops until a pod
reschedules. This PDB caps how many worker pods a voluntary disruption may take down at
once so at least one keeps draining the loops.

Rendered ONLY when worker.replicaCount > 1 (the worker has no autoscaler). At the single-
worker default it renders NOTHING, so a node drain of the lone worker is never blocked —
the same "safe at replicaCount 1" behaviour as the API PDB. Overridable via
worker.podDisruptionBudget; set worker.podDisruptionBudget.enabled=false to ship none.
*/ -}}
{{- if .Values.worker.podDisruptionBudget.enabled }}
{{- if gt (int .Values.worker.replicaCount) 1 }}
{{- $pdb := .Values.worker.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "livecore.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "livecore.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if $pdb.minAvailable }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "livecore.componentSelectorLabels" (dict "root" $ "component" "worker") | nindent 6 }}
{{- end }}
{{- end }}
