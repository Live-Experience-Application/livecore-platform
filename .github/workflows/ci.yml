# CI pipeline for livecore-platform (CORE-FND-003, docker job: CORE-FND-005).
#
# Runs the commands documented in README.md verbatim. Independent jobs:
#   dotnet               - locked-mode restore verification, build, the whole test suite on SQLite, format/code-style verification
#   coverage             - collect code coverage (the SQLite leg plus a real Postgres/Valkey leg, so the provider-divergent xmin/advisory-lock/backplane branches are coverage-counted, CORE-TST-010), report it, run the threshold gate (BLOCKING below the line-coverage floor, CORE-TST-001/CORE-TST-009)
#   typescript           - pnpm install, lint, format check, package builds/tests, cross-package version lockstep (CORE-CMP-003), local pack convenience (pack:local emits the four @livecore tarballs to dist/, CORE-DXL-002)
#   boundary-scan        - forbidden vertical term scan (pwsh on Linux)
#   codeql               - CodeQL SAST over the first-party C# and TypeScript sources; fails the build on a high/critical security finding, gate-logic tested (CORE-SEC-006)
#   dependency-audit     - audit the project's OWN dependency graph for known-vulnerable packages: dotnet list --vulnerable (transitive included) + pnpm audit, fail closed on high/critical, gate-logic tested (CORE-DEP-005)
#   spec-consistency     - doc/csv route/table/event/epic consistency check (CORE-DOC-001); also drift-gates the committed OpenAPI document against the routes and uploads it as a build artifact (CORE-OAS-001)
#   license-compliance   - third-party NOTICE drift/coverage gate, distribution completeness (NOTICE/LICENSE shipped, OCI labels) and the SBOM license-gate logic test (a seeded disallowed license fails) (CORE-LIC-003)
#   contributor-policy   - DCO sign-off on the pushed/PR commits + SPDX source-header lint, with the gate-logic test (a headerless source file and an unsigned commit fail) (CORE-LIC-004)
#   changelog-completeness - fail when a published package src/ changed since the last release tag with no CHANGELOG entry newer than the tag, gate-logic tested (CORE-REL-004)
#   migration-down-lint  - flag a destructive migration Down() (DropColumn/DropTable) for review (CORE-DR-004)
#   storage-docs         - grep backstop: keep RustFS the default example S3-compatible backend in the storage/self-hosting docs, no leftover MinIO setup guidance, any-S3-compatible contract stated (CORE-STOR-002)
#   action-pin-lint      - fail the build on any workflow uses: ref not pinned to a full 40-char commit SHA (CORE-DEP-008)
#   log-redaction        - enforce ID-only structured logging: fail the build on a content/PII/secret or interpolated log template (CORE-OBS-006, threat T7)
#   backup-restore-drill - runnable restore drill over the systems of record (CORE-OPS-010)
#   backup-restore-postgres - REAL backup/restore round-trip against live Postgres (CORE-DR-002)
#   powershell-lint      - PSScriptAnalyzer over scripts/*.ps1
#   docker               - image builds and container smoke tests (no push)
#   compose-smoke        - deployment manifest renders/starts + migrate gate (CORE-DEP-001)
#   compose-full-smoke   - full local stack overlay starts (Core + Keycloak OIDC + RustFS storage + Valkey backplane) and the documented probes answer 200 (CORE-DEP-006)
#   helm-chart           - render/validate the Kubernetes Helm chart: static gate + helm lint + helm template + kubeconform schema validation, asserting the pre-install migrate Job, the probes, the resource requests/limits ceiling and no hardcoded secret (CORE-DEP-004/CORE-DEP-010)
#   observability-assets - validate the example Prometheus rules/scrape config + SLO/dashboard assets (promtool check + consistency gate) (CORE-OBS-008)
#   publish-dry-run      - verify image tags + image-scan gate test + cosign verification gate test + release-tag-vs-package-version gate test + dry-run build, SBOM and CVE scan (BLOCKING on critical on PRs, CORE-DEP-005), and a cosign sign/attest/verify round-trip against the locally-built digest with a throwaway key, no push (CORE-OPS-009, CORE-DEP-003, CORE-DEP-005, CORE-SEC-008, CORE-CMP-003)
#   publish-packages-dry-run - package-publish gate-logic test + dry-run npm publish (pnpm publish --dry-run) packing all four @livecore packages on every push/PR, no registry push (CORE-PUB-002)
#   migrations           - apply all migrations to an empty Postgres (CORE-OPS-001)
#   integration-postgres - drift gate + integration suite on real Postgres (CORE-OPS-002); also runs the cross-instance Redis/Valkey backplane propagation test against a Redis service (CORE-TST-003)
#   unit-smoke-postgres  - run the unit + smoke suites against real Postgres so provider-specific behavior is exercised (CORE-TST-004)
#   publish              - assert release tag == package version (CORE-CMP-003), SBOM + CVE scan (fail on critical), then push immutable, versioned images on a release tag only (CORE-OPS-009, CORE-DEP-003); each pushed image is then signed (keyless OIDC cosign) and its CycloneDX SBOM attached as an attestation, with cosign verify / verify-attestation gating the digest fail-closed under a job-scoped id-token: write (CORE-SEC-008)
#   publish-packages     - on a release tag only: publish the four @livecore packages to npm at the shared lockstep version, gated by the release-version + lockstep gate (assert-release-version.ps1) and refusing a republish of an existing version (immutability) (CORE-PUB-002); each version is published with npm build provenance under a job-scoped id-token: write (CORE-PUB-004)
#
# Every push and pull request runs the quality gates only. The publish and
# publish-packages jobs run only on a release tag push ('v<MAJOR>.<MINOR>.<PATCH>')
# and only after every gate passes, so neither a registry image push nor an npm
# publish ever happens on a pull request or a branch.
name: CI

on:
  push:
    branches: [main]
    # Release tags publish versioned container images (CORE-OPS-009). The same
    # push also runs every quality gate below; the publish job is gated on them.
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build, test and format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Verify locked restore (committed lock files match the resolved graph)
        # CORE-CMP-002: restore the whole solution in locked mode so CI fails if any
        # committed packages.lock.json drifts from the graph the .csproj files resolve.
        # The release images restore in this same locked mode (apps/api/Dockerfile,
        # apps/worker/Dockerfile, apps/api/Migrations.Dockerfile), so gating CI on it
        # guarantees the dependency closure CI builds and tests against is exactly the
        # one a published image restores - the two can never silently diverge.
        run: dotnet restore LiveCore.slnx --locked-mode

      - name: Build solution
        run: dotnet build LiveCore.slnx

      - name: Run the test suite (unit, smoke and integration on SQLite)
        # dotnet test on the whole solution runs the unit AND smoke AND integration
        # test projects; with no Postgres service and LIVECORE_TEST_DB_PROVIDER unset
        # they all run on in-memory SQLite. This step used to be mislabeled "Run smoke
        # tests" (CORE-TST-004); the matching real-Postgres leg is the
        # unit-smoke-postgres and integration-postgres jobs below.
        run: dotnet test LiveCore.slnx

      - name: Verify formatting and code style
        run: dotnet format LiveCore.slnx --verify-no-changes

  coverage:
    name: Code coverage (collect, report, gate)
    runs-on: ubuntu-latest
    # CORE-TST-001: coverlet.collector is referenced by every test project, but no
    # step collected coverage or gated on it, so the strong test coverage was
    # unguarded - a new untested production handler could silently regress it and
    # the "no feature without tests" Definition of Done rested on author
    # discipline alone (docs/14, docs/17). This job closes that gap:
    #   1. it unit-tests the gate logic first (a seeded, deliberately-untested new
    #      handler trips the threshold once blocking is enabled),
    #   2. collects coverage with the already-referenced collector (no new
    #      dependency) - one coverage.cobertura.xml per test project,
    #   3. uploads the reports as a build artifact, and
    #   4. runs the threshold gate over the merged, de-duplicated,
    #      production-focused number (test assemblies and generated EF migrations
    #      excluded; see scripts/LiveCoreCoverage.psm1).
    # The gate is now BLOCKING (CORE-TST-009): a production line-coverage
    # regression below the floor fails the build. It ran NON-BLOCKING first
    # (assert-coverage.ps1 -ReportOnly) to report coverage without failing; then
    # -ReportOnly was dropped and the floor (-MinimumLineCoverage 90) was set just
    # below the production coverage measured when the gate was made blocking
    # (92.79%), with a small margin for the run-to-run variance of the
    # concurrency/retry integration tests. Ratchet the floor up toward the current
    # coverage over time, never down - this is the same staged report-only ->
    # blocking posture the supply-chain image scan followed (CORE-DEP-005).
    #
    # CORE-TST-010: the SQLite collection step alone runs on a runner with NO
    # Postgres/Redis, so the provider-divergent branches that only run there - the
    # Npgsql xmin optimistic-concurrency token, the advisory-lock migration runner
    # and the Redis/Valkey realtime backplane - executed as no-ops and reported
    # UNCOVERED, understating real exercise (they run blocking in the
    # integration-postgres / unit-smoke-postgres jobs but were never
    # coverage-counted). This job now ALSO collects coverage on a real Postgres +
    # Valkey leg (the "Collect coverage on the Postgres/Redis leg" step) into the
    # same results directory, and the gate MERGES it with the SQLite-leg reports, so
    # a line covered on either leg counts once (scripts/LiveCoreCoverage.psm1). The
    # floor stays BLOCKING and is unchanged (never lowered): merging only flips
    # no-op lines to covered, so the gated number can rise, never fall.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Valkey is the Redis-compatible backplane docs/02_ARCHITECTURE.md names; the
      # cross-instance realtime propagation branch (CORE-TST-003) only runs with it
      # present, so it is here to be coverage-counted, not only in integration-postgres.
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Test the coverage gate logic (a seeded untested handler trips it)
        run: pwsh -NoProfile -File scripts/test-coverage-gate.ps1

      - name: Run the test suite with coverage collection (SQLite leg)
        run: dotnet test LiveCore.slnx --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Collect coverage on the Postgres/Redis leg (provider-divergent branches, CORE-TST-010)
        # The step above ran the suite on SQLite, where the provider-divergent
        # branches are no-ops. Re-run the two Postgres-backed legs that exercise
        # them - the integration suite (the advisory-lock migration runner and the
        # Redis/Valkey backplane propagation) and the unit suite (the Npgsql xmin
        # optimistic-concurrency token, ProviderDivergentConcurrencyTests) - against
        # the real Postgres + Valkey services, with coverage collected into the SAME
        # results directory so the gate merges these reports with the SQLite-leg ones
        # (max hits per line). The env is set at the STEP level only, so the SQLite
        # collection above is unaffected and stays on SQLite. No credential is
        # committed: these point at the ephemeral CI service containers above, which
        # the suites create and drop their own per-test databases against (threat T7).
        env:
          LIVECORE_TEST_DB_PROVIDER: Postgres
          LIVECORE_TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
          LIVECORE_TEST_REDIS: "localhost:6379"
        run: |
          dotnet test tests/LiveCore.Api.IntegrationTests/LiveCore.Api.IntegrationTests.csproj --collect:"XPlat Code Coverage" --results-directory ./TestResults
          dotnet test tests/LiveCore.Api.UnitTests/LiveCore.Api.UnitTests.csproj --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload the coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cobertura
          path: "TestResults/**/coverage.cobertura.xml"
          if-no-files-found: error

      - name: Report coverage and run the threshold gate (blocking, CORE-TST-009)
        # BLOCKING: a production line-coverage regression below the 90% floor fails
        # the build - the -ReportOnly flag is gone. The floor sits just below the
        # 92.79% production coverage measured when the gate was made blocking, so a
        # new untested handler that drags coverage under the floor fails CI. Ratchet
        # -MinimumLineCoverage up toward the current coverage over time; never lower
        # it. test-coverage-gate.ps1 asserts this floor and the blocking posture (no
        # -ReportOnly here), so re-adding -ReportOnly or moving the floor without
        # updating the test fails CI. See docs/14 ("Coverage measurement and the CI
        # gate") and docs/17 (Definition of Done).
        run: pwsh -NoProfile -File scripts/assert-coverage.ps1 -ReportDirectory ./TestResults -MinimumLineCoverage 90

  typescript:
    name: TypeScript lint, format and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable Corepack (pinned pnpm)
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Verify formatting
        run: pnpm run format:check

      - name: Build packages
        run: pnpm --recursive run build

      - name: Drift-gate the OpenAPI-derived contracts (CORE-OAS-002)
        # Regenerate @livecore/contracts' OpenAPI-derived types from the committed
        # OpenAPI document (openapi/livecore-v1.json, itself drift-gated against the
        # registered routes by spec-consistency check 12) and fail on any diff, so
        # the server's contract and the published TypeScript types cannot silently
        # diverge. The package build test asserts the same thing for `pnpm --recursive
        # run test`; this is the explicit, named gate (docs/23_PACKAGE_VERSIONING.md).
        run: pnpm --filter @livecore/contracts run check:openapi

      - name: Drift-gate the TypeScript session-event contract (CORE-RT-008)
        # Fail if @livecore/contracts' session-event vocabulary (KnownSessionEventTypes)
        # or payload field sets (KnownSessionEventPayloadFields) diverge from the server:
        # the non-deferred csv/event_catalog.csv events, the SessionEventTypes.cs constants
        # and the SessionEventPayloads.cs payload records. The TypeScript-side mirror of
        # spec-consistency check 11 (the package test asserts the same thing for
        # `pnpm --recursive run test`; this is the explicit, named gate).
        run: pnpm --filter @livecore/contracts run check:events

      - name: Drift-gate the SDK to api_routes coverage parity (CORE-SDK-007)
        # Fail if @livecore/sdk-ts does not expose exactly one typed client method per
        # non-callback csv/api_routes.csv route: a route added without an SDK method, or
        # an SDK method without a route, fails here, so the SDK can never silently fall
        # behind the API again (the provider-facing store-notification callbacks are
        # excepted). The TypeScript-side mirror of spec-consistency check 6 (the package
        # test asserts the same thing for `pnpm --recursive run test`; this is the
        # explicit, named gate - docs/23_PACKAGE_VERSIONING.md).
        run: pnpm --filter @livecore/sdk-ts run check:sdk-parity

      - name: Run package tests
        run: pnpm --recursive run test

      - name: Cross-package version lockstep test (CORE-CMP-003)
        # The per-package build tests check each package's OWN version triple;
        # this asserts the four packages share ONE version across package.json,
        # the exported VERSION and every changelog (incl. the root CHANGELOG), so
        # bumping one package out of lockstep fails CI (docs/23_PACKAGE_VERSIONING.md).
        run: pnpm run test:versions

      - name: Local pack convenience test (CORE-DXL-002)
        # `pnpm run pack:local` is a thin, ADDITIVE convenience that builds and packs
        # the four @livecore packages to the gitignored dist/ as .tgz tarballs, so a
        # downstream vertical can consume an UNRELEASED Core through its own test
        # harness without a registry publish. This runs the real pack into dist/ and
        # asserts it emits the four tarballs at the current, unchanged version with the
        # public entry (VERSION + PACKAGE_NAME) intact, that a throwaway consumer
        # resolves @livecore/* to the packed content, and that the pack modifies no
        # tracked file. It adds no publish/release step, so the npm publish path is
        # unchanged (docs/23_PACKAGE_VERSIONING.md).
        run: pnpm run test:pack-local

  boundary-scan:
    name: Boundary scan (forbidden vertical terms)
    runs-on: ubuntu-latest
    # CORE-BND-001: the scanner enumerates TRACKED source only (git ls-files), so
    # gitignored tooling is excluded, *.Dockerfile is in scope, and the docs/ and
    # csv/ trees plus the root documentation files are excluded. The test step
    # proves that coverage over a throwaway git work tree (a seeded brand term in
    # a tracked .cs/Dockerfile is flagged, gitignored and documentation files are
    # not, and a non-git tree fails closed), then guards the real tree.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test the boundary scan logic
        run: pwsh -NoProfile -File scripts/test-boundary-scan.ps1

      - name: Run boundary scan
        run: pwsh -NoProfile -File scripts/boundary-scan.ps1

  codeql:
    name: CodeQL static analysis (C# and TypeScript)
    runs-on: ubuntu-latest
    # CORE-SEC-006: the first static security analysis of FIRST-PARTY code. CI
    # already scanned dependencies (the Trivy CVE scan and pinned lock files,
    # CORE-DEP-003/CORE-CMP-002) but never statically analyzed the C# and
    # TypeScript the project itself writes. This job runs CodeQL over both
    # languages on every push and pull request and FAILS THE BUILD on a
    # high/critical security finding, so a newly introduced injection,
    # cleartext-secret or similar high-severity defect in the sources cannot
    # merge or reach a release.
    #
    # The severity gate is fail-closed and self-contained: rather than depend on
    # GitHub code scanning being enabled, CodeQL writes its SARIF locally
    # (upload: false) and scripts/assert-codeql-findings.ps1 decides the verdict
    # over it - blocking on any result whose rule scores security-severity >= 7.0
    # (the high/critical band; the documented gate). The gate logic is proven
    # first by scripts/test-codeql-gate.ps1 (a seeded high/critical SARIF fails
    # closed; a clean or medium/low one passes; a malformed/non-SARIF document is
    # rejected), then the real analysis is gated. C# is analyzed in manual build
    # mode against the same `dotnet build` the dotnet job runs; TypeScript needs
    # no build (build-mode: none). See docs/14 and README "Continuous integration".
    permissions:
      # Least privilege: the SARIF is gated locally and never uploaded to code
      # scanning, so the default read-only token is enough - no security-events
      # write scope is requested.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test the CodeQL severity-gate logic (a seeded high/critical finding fails closed)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-codeql-gate.ps1

      - name: Set up .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the .NET solution for CodeQL (manual build mode)
        if: matrix.language == 'csharp'
        run: dotnet build LiveCore.slnx

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          output: codeql-results
          # Gate locally on the SARIF rather than upload to code scanning, so the
          # gate needs no GitHub Advanced Security and fails closed on its own.
          upload: false

      - name: Gate on high/critical security findings (fail closed)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/assert-codeql-findings.ps1 -ResultsDirectory codeql-results

      - name: Upload the CodeQL SARIF results (build artifact)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results/*.sarif
          if-no-files-found: error

  dependency-audit:
    name: Dependency vulnerability audit (CORE-DEP-005)
    runs-on: ubuntu-latest
    # CORE-DEP-005: the first audit of the project's OWN declared dependency graph
    # for known-vulnerable packages. CI already scanned the published images for
    # CVEs (Trivy, CORE-DEP-003), pinned the lock files (CORE-CMP-002) and
    # statically analyzed the first-party sources (CodeQL, CORE-SEC-006) - but it
    # never failed on a known-vulnerable first-party DEPENDENCY. This job audits
    # both ecosystems on every push and pull request and FAILS CLOSED on a
    # high/critical advisory:
    #   1. it unit-tests the gate logic first (a seeded high/critical vulnerable
    #      package in a `dotnet list --vulnerable` and a `pnpm audit` report fails
    #      closed; a clean or moderate-only report passes; a malformed report is
    #      rejected) - the required "a seeded vulnerable-package fixture proves it
    #      fails closed" test;
    #   2. it restores the solution in locked mode (CORE-CMP-002) and runs
    #      `dotnet list LiveCore.slnx package --vulnerable --include-transitive
    #      --format json` over the .NET projects (transitive included);
    #   3. it installs the workspace with the frozen lockfile and runs
    #      `pnpm audit --json` over the TypeScript workspace (`pnpm audit` exits
    #      non-zero on any advisory, so its own exit code is ignored and the gate
    #      decides severity); and
    #   4. it runs the fail-closed gate (scripts/assert-dependency-audit.ps1) at
    #      the agreed bar - HIGH and CRITICAL block, moderate/low are reported -
    #      so a high/critical advisory on a first-party direct or transitive
    #      dependency fails the build. The two reports are uploaded as an artifact.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test the dependency-audit gate logic (a seeded vulnerable package fails closed)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-dependency-audit.ps1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Restore the solution (locked mode)
        # Reuse the CORE-CMP-002 locked restore so the graph audited is exactly the
        # committed dependency closure the build and the release images restore.
        run: dotnet restore LiveCore.slnx --locked-mode

      - name: Audit the .NET dependency graph (vulnerable, transitive included)
        # `dotnet list package --vulnerable` is report-only by nature (it exits 0
        # even when it finds vulnerabilities), so the JSON is captured here and the
        # gate below makes the pass/fail decision.
        run: dotnet list LiveCore.slnx package --vulnerable --include-transitive --format json > dotnet-vulnerable.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable Corepack (pinned pnpm)
        run: corepack enable pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit the pnpm workspace
        # `pnpm audit` exits non-zero on any advisory (including moderate/low), so
        # its exit code is ignored here and the gate below decides severity. A
        # failure to even produce a report leaves an empty file, which the
        # fail-closed gate then rejects.
        run: pnpm audit --json > pnpm-audit.json || true

      - name: Gate on high/critical source dependency vulnerabilities (fail closed)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/assert-dependency-audit.ps1 -DotnetReportPath dotnet-vulnerable.json -PnpmReportPath pnpm-audit.json

      - name: Upload the dependency-audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: |
            dotnet-vulnerable.json
            pnpm-audit.json
          if-no-files-found: error

  spec-consistency:
    name: Spec consistency (routes/tables/events/epics)
    runs-on: ubuntu-latest
    # CORE-DOC-001 + CORE-SPEC-001: fails when the route, table, event or epic
    # specifications in docs/ and csv/ drift from each other, from their single
    # source of truth (see docs/24_SPEC_CONSISTENCY.md) OR from the implementation
    # (the minimal-API registrations + the EF model snapshot). CORE-OAS-001 adds
    # check 12, which fails when the committed OpenAPI document
    # (openapi/livecore-v1.json) does not describe exactly the registered /api/v1
    # routes; the document is also uploaded here as a build artifact. Pure source
    # check, no build needed.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test the spec consistency check logic
        run: pwsh -NoProfile -File scripts/test-spec-consistency.ps1

      - name: Run spec consistency check
        run: pwsh -NoProfile -File scripts/spec-consistency.ps1

      - name: Upload the OpenAPI document (build artifact, CORE-OAS-001)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-v1
          path: openapi/livecore-v1.json
          if-no-files-found: error

  license-compliance:
    name: License compliance and third-party attribution (CORE-LIC-003)
    runs-on: ubuntu-latest
    # CORE-LIC-003: the distribution must be legally complete and license-checked.
    # This job proves the pure logic on every push and pull request, with no Docker
    # or registry:
    #   1. the third-party NOTICE inventory is generated from
    #      csv/third_party_notices.csv (THIRD-PARTY-NOTICES.md, drift-gated) and
    #      every direct, runtime-shipping NuGet dependency is attributed
    #      (generate-third-party-notices.ps1 in check mode);
    #   2. the NOTICE and the AGPL LICENSE ship in every package, and the API/worker
    #      Dockerfiles carry the OCI org.opencontainers.image.licenses (+ source,
    #      revision) labels and copy the NOTICE/LICENSE into the image
    #      (test-distribution-compliance.ps1);
    #   3. the SBOM license gate fails on a seeded disallowed or unknown license
    #      (test-license-compliance.ps1). The gate runs for real over the produced
    #      CycloneDX SBOM in the publish-dry-run/publish jobs.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test the license-compliance gate logic (a seeded disallowed license fails)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-license-compliance.ps1

      - name: Test distribution completeness (NOTICE + LICENSE shipped, OCI labels)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-distribution-compliance.ps1

      - name: Drift-gate the third-party NOTICE inventory and its coverage
        shell: pwsh
        run: pwsh -NoProfile -File scripts/generate-third-party-notices.ps1

  contributor-policy:
    name: Contributor IP policy (DCO sign-off + SPDX headers, CORE-LIC-004)
    runs-on: ubuntu-latest
    # CORE-LIC-004: the Core is AGPL-3.0-or-later and dual-licensed (CORE-LIC-002),
    # so contribution provenance must be clean and license context must travel with
    # the source. This job enforces both controls and proves the gate logic:
    #   1. test-contributor-policy.ps1 proves the pure logic on every run - a
    #      headerless shipped source file and a commit with no matching sign-off are
    #      rejected, and a headered file / signed-off commit pass;
    #   2. lint-license-headers.ps1 verifies every in-scope first-party .cs/.ts/.tsx
    #      source file (the C# that builds the images and the TypeScript that builds
    #      the packages; generated EF migrations and the generated OpenAPI types are
    #      excluded) carries the SPDX AGPL-3.0-or-later header;
    #   3. lint-dco-signoff.ps1 validates that every commit introduced by THIS push
    #      or pull request carries a Signed-off-by trailer matching its author
    #      (merge commits exempt). It checks only the new commits, not the project's
    #      whole history, so it binds new contributions without failing pre-policy
    #      commits - hence fetch-depth: 0, so the base..head range is available.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the DCO lint can resolve the base..head commit range.
          fetch-depth: 0

      - name: Test the contributor-policy gate logic (a headerless file and an unsigned commit fail)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-contributor-policy.ps1

      - name: Lint SPDX source headers on shipped first-party source
        shell: pwsh
        run: pwsh -NoProfile -File scripts/lint-license-headers.ps1

      - name: Enforce DCO sign-off on the pushed/PR commits
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            pwsh -NoProfile -File scripts/lint-dco-signoff.ps1 -BaseSha $env:PR_BASE_SHA -HeadSha $env:PR_HEAD_SHA
          }
          else {
            pwsh -NoProfile -File scripts/lint-dco-signoff.ps1 -BaseSha $env:PUSH_BEFORE_SHA -HeadSha $env:PUSH_AFTER_SHA
          }

  changelog-completeness:
    name: Changelog completeness (CORE-REL-004)
    runs-on: ubuntu-latest
    # CORE-REL-004: a change to a published package's typed surface must not ship
    # undocumented. The 0.3.0 cut found that a package src/ change can land with no
    # changelog entry, so the release had to reconstruct the changelog from the commit
    # range. This gate fails when packages/<pkg>/src changed since the last release tag
    # with no CHANGELOG entry newer than that tag (an Unreleased section carrying a
    # bullet, or a dated entry above the tag - a release cut but not yet tagged). The
    # gate-logic test proves the pure decision on every run; fetch-depth: 0 makes the
    # <lastTag>..HEAD range and the tags available.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history + tags so the last-release-tag..HEAD range resolves.
          fetch-depth: 0

      - name: Test the changelog-completeness gate logic
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-changelog-completeness.ps1

      - name: Enforce changelog completeness since the last release tag
        shell: pwsh
        run: pwsh -NoProfile -File scripts/lint-changelog-completeness.ps1

  migration-down-lint:
    name: Migration Down() review (CORE-DR-004)
    runs-on: ubuntu-latest
    # CORE-DR-004: migrations are roll-forward-only - a Down() is never run in
    # production because every one drops the table/column its Up() added. This
    # lint flags any migration whose Down() drops a table or column so a new
    # destructive Down() cannot merge without being reviewed and acknowledged in
    # csv/migration_destructive_down_review.csv under the documented policy
    # (docs/13_SELF_HOSTING_REQUIREMENTS.md, "Migration rollback policy"). Pure
    # docs/scripts check, no build needed.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test the destructive-Down lint logic
        run: pwsh -NoProfile -File scripts/test-migration-down-lint.ps1

      - name: Flag any unreviewed destructive migration Down()
        run: pwsh -NoProfile -File scripts/lint-migration-downs.ps1

  storage-docs:
    name: Storage docs RustFS backstop (CORE-STOR-002)
    runs-on: ubuntu-latest
    # CORE-STOR-002: after the MinIO -> RustFS object-store migration (CORE-STOR-001),
    # the self-hosting and storage docs must keep RustFS named as the default example
    # S3-compatible backend, carry no leftover MinIO setup/console/credential guidance,
    # and keep the any-S3-compatible contract stated so operators may still bring their
    # own provider (ADR 0006). The test step proves the backstop logic over fixtures (a
    # doc still naming MinIO fails; a clean RustFS doc passes) and then guards the real
    # docs. Pure docs/scripts check, no build needed.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test the storage-docs RustFS backstop logic
        run: pwsh -NoProfile -File scripts/test-storage-docs-rustfs.ps1

      - name: Fail on any remaining MinIO setup guidance in the storage docs
        run: pwsh -NoProfile -File scripts/lint-storage-docs-rustfs.ps1

  action-pin-lint:
    name: GitHub Actions commit-SHA pinning (CORE-DEP-008)
    runs-on: ubuntu-latest
    # CORE-DEP-008: every `uses:` in .github/workflows/* must be pinned to an
    # immutable commit SHA (with the readable version in a trailing comment), so a
    # compromised or retagged third-party action cannot silently run inside this
    # pipeline - including the publish job that holds the registry's packages: write
    # token. This extends the digest-pinning discipline the Dockerfiles already
    # apply to their base images (apps/api/Dockerfile) to the workflows. The
    # companion .github/dependabot.yml keeps the pins current (Dependabot bumps the
    # SHA and rewrites the version comment on a new release). The test step proves
    # the lint logic over fixtures (a SHA-pinned ref passes; a floating tag, a
    # semver tag, a branch and a comment-less SHA each fail) and then guards the
    # real tree, then the lint itself guards the tree. Pure source check, no build
    # needed.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test the action-pin lint logic (a seeded floating-tag ref fails closed)
        run: pwsh -NoProfile -File scripts/test-action-pin-lint.ps1

      - name: Fail on any unpinned workflow action reference
        run: pwsh -NoProfile -File scripts/lint-action-pins.ps1

  log-redaction:
    name: Log redaction guardrail (CORE-OBS-006)
    runs-on: ubuntu-latest
    # CORE-OBS-006: ID-only structured logging (threat T7) is enforced mechanically,
    # not by reviewer discipline. The lint scans the tracked first-party apps/ C#
    # source for an ILogger call whose message template would put a value into the
    # log text - an interpolated template, a value concatenated into a template, or a
    # content/PII/secret structured placeholder ({Email}, {DisplayName}, {AccessToken},
    # {ContentBody}, ...) - so a future content-bearing log statement fails the build,
    # while the existing ID-only logs pass. The test step proves the logic over
    # fixtures (a seeded content-bearing/interpolated template is flagged; the existing
    # ID-only templates and an object BeginScope are not) and then guards the real
    # tree, then the scan itself guards the tree. Pure source check, no build needed.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test the log-redaction guardrail logic
        run: pwsh -NoProfile -File scripts/test-log-redaction.ps1

      - name: Run log-redaction lint
        run: pwsh -NoProfile -File scripts/lint-log-redaction.ps1

  backup-restore-drill:
    name: Backup/restore drill (CORE-OPS-010)
    runs-on: ubuntu-latest
    # Runs the verifiably-runnable restore drill: a full backup -> restore ->
    # verify round-trip over a fixture modeling the append-only audit,
    # session-event and purchase systems of record, proving a faithful restore is
    # accepted and a lossy or tampered one is rejected fail-closed. No database or
    # object store needed (scripts/test-backup-restore-drill.ps1).
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run the backup/restore drill
        run: pwsh -NoProfile -File scripts/test-backup-restore-drill.ps1

  backup-restore-postgres:
    name: Real backup/restore round-trip on PostgreSQL (CORE-DR-002)
    runs-on: ubuntu-latest
    # CORE-DR-002: the backup-restore-drill job above proves the coverage and
    # integrity LOGIC with an in-memory fixture, but the real backup-livecore.ps1 /
    # restore-livecore.ps1 - the scripts that actually invoke pg_dump / pg_restore /
    # psql and the to_jsonb content checksum - were never run against a real
    # PostgreSQL, so a broken tool argument would ship green and the RTO/RPO claims
    # would rest on an untested path. This job runs the REAL scripts end to end
    # against the same Postgres service the migrations/integration-postgres jobs use:
    # it seeds the systems-of-record tables, backs them up, restores into a FRESH
    # database and asserts the full backup -> restore -> integrity round-trip
    # (real pg_dump/pg_restore/psql + to_jsonb row-count/checksum) passes.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livecore_backup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No credentials in the repository: these are throwaway CI databases whose
      # password exists only for the ephemeral service container.
      SOURCE_CONNECTION_STRING: "Host=localhost;Port=5432;Database=livecore_backup_ci;Username=postgres;Password=postgres"
      RESTORE_CONNECTION_STRING: "Host=localhost;Port=5432;Database=livecore_restore_ci;Username=postgres;Password=postgres"
      # Backups are encrypted at rest (CORE-DR-001), so the scripts refuse to run
      # without a passphrase. This is a throwaway CI-only value, never a real secret.
      Backup__Encryption__Passphrase: "ci-backup-restore-roundtrip-passphrase"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the PostgreSQL 17 client (matching pg_dump/pg_restore/psql)
        # The runner's bundled client may be older than the postgres:17 service, and
        # pg_dump refuses to dump a newer server. Install the matching major and put
        # it first on PATH so the scripts' default pg_dump/pg_restore/psql resolve to
        # version 17.
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Build migrations runner image
        run: docker build --file apps/api/Migrations.Dockerfile --tag livecore-migrations:ci .

      - name: Apply the real migrations to the source database
        run: |
          docker run --rm --network host \
            --env ConnectionStrings__Database="$SOURCE_CONNECTION_STRING" \
            livecore-migrations:ci

      - name: Run the real backup -> restore -> integrity round-trip
        run: |
          pwsh -NoProfile -File scripts/test-backup-restore-postgres.ps1 \
            -SourceConnectionString "$SOURCE_CONNECTION_STRING" \
            -RestoreConnectionString "$RESTORE_CONNECTION_STRING"

  docker:
    name: Docker image builds and container smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build API image
        run: docker build --file apps/api/Dockerfile --build-arg SOURCE_REVISION=${{ github.sha }} --tag livecore-api:ci .

      - name: Build worker image
        run: docker build --file apps/worker/Dockerfile --build-arg SOURCE_REVISION=${{ github.sha }} --tag livecore-worker:ci .

      - name: Assert the images carry the OCI license label and ship the NOTICE (CORE-LIC-003)
        # The redistributed images must be legally complete: declare their license
        # with the OCI org.opencontainers.image.licenses label and carry the AGPL
        # LICENSE plus the generated third-party NOTICE inventory under /licenses.
        run: |
          set -euo pipefail
          for image in livecore-api:ci livecore-worker:ci; do
            license="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$image")"
            source="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")"
            revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            echo "$image: licenses=$license source=$source revision=$revision"
            if [ "$license" != "AGPL-3.0-or-later" ]; then
              echo "Image $image is missing the OCI org.opencontainers.image.licenses=AGPL-3.0-or-later label."
              exit 1
            fi
            if [ -z "$source" ]; then
              echo "Image $image is missing the OCI org.opencontainers.image.source label."
              exit 1
            fi
            # The AGPL LICENSE and the generated third-party NOTICE ship in the image.
            docker run --rm --entrypoint sh "$image" -c 'test -s /licenses/LICENSE && test -s /licenses/THIRD-PARTY-NOTICES.md'
          done
          echo "Both images carry the OCI license label and ship the LICENSE + third-party NOTICE."

      - name: Smoke test API container (/health/live)
        run: |
          docker run --detach --name livecore-api-smoke --publish 8080:8080 livecore-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:8080/health/live; then
              echo "API container answered /health/live after $attempt attempt(s)."
              exit 0
            fi
            sleep 1
          done
          echo "API container did not answer /health/live in time."
          docker logs livecore-api-smoke
          exit 1

      - name: Smoke test worker container (clean startup)
        run: |
          docker run --detach --name livecore-worker-smoke livecore-worker:ci
          sleep 5
          status="$(docker inspect --format '{{.State.Status}}' livecore-worker-smoke)"
          docker logs livecore-worker-smoke
          if [ "$status" != "running" ]; then
            echo "Worker container is not running (status: $status)."
            exit 1
          fi
          echo "Worker container started and stayed running."

      - name: Clean up smoke test containers
        if: always()
        run: docker rm --force livecore-api-smoke livecore-worker-smoke || true

  compose-smoke:
    name: Deployment manifest smoke (CORE-DEP-001)
    runs-on: ubuntu-latest
    # CORE-DEP-001: the in-repo deployment manifest (deploy/compose/docker-compose.yml)
    # must let an operator deploy from this repo alone. The two easy-to-get-wrong
    # pieces - the migrate-before-API ordering (depends_on:
    # service_completed_successfully) and the heartbeat liveness probe - used to
    # exist only as prose. This job proves both:
    #   1. RENDERS/VALIDATES: a no-Docker static check (scripts/test-compose-deploy.ps1)
    #      that the manifest wires the migrate gate, the postgres healthcheck, all
    #      four services and the documented probes, plus `docker compose config`.
    #   2. STARTS + GATE: brings the stack up against Docker and asserts the
    #      migrations runner exits 0, the API and worker start ONLY AFTER it
    #      completes (the gate), and the documented health/readiness/liveness
    #      endpoints answer 200.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate the compose manifest (gate + probes, no Docker)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-compose-deploy.ps1

      - name: Render the compose manifest
        run: docker compose -f deploy/compose/docker-compose.yml config

      - name: Start the stack (postgres -> migrate gate -> api + worker)
        working-directory: deploy/compose
        run: docker compose up -d --build

      - name: The migrations runner ran to completion (exit 0)
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          migrate_cid="$(docker compose ps -aq migrate)"
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$migrate_cid")"
          echo "migrate exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            docker compose logs migrate
            echo "Migrations runner did not exit 0."
            exit 1
          fi

      - name: The migrate gate blocked API/worker start until migrations completed
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          migrate_cid="$(docker compose ps -aq migrate)"
          api_cid="$(docker compose ps -aq api)"
          worker_cid="$(docker compose ps -aq worker)"
          migrate_finished="$(date -d "$(docker inspect -f '{{.State.FinishedAt}}' "$migrate_cid")" +%s%N)"
          api_started="$(date -d "$(docker inspect -f '{{.State.StartedAt}}' "$api_cid")" +%s%N)"
          worker_started="$(date -d "$(docker inspect -f '{{.State.StartedAt}}' "$worker_cid")" +%s%N)"
          echo "migrate finished (ns): $migrate_finished"
          echo "api started (ns):      $api_started"
          echo "worker started (ns):   $worker_started"
          if [ "$api_started" -lt "$migrate_finished" ] || [ "$worker_started" -lt "$migrate_finished" ]; then
            echo "GATE VIOLATION: API or worker started before migrations completed."
            exit 1
          fi
          echo "Gate held: API and worker started only after the migrations runner completed."

      - name: The documented health/readiness/liveness probes answer 200
        run: |
          set -euo pipefail
          probe() {
            local url="$1"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --output /dev/null "$url"; then
                echo "OK: $url answered after $attempt attempt(s)."
                return 0
              fi
              sleep 1
            done
            echo "FAILED: $url did not answer 200 in time."
            return 1
          }
          probe http://localhost:8080/health/live    # API liveness
          probe http://localhost:8080/health/ready    # API readiness
          probe http://localhost:9464/health/live     # worker per-loop heartbeat liveness
          probe http://localhost:9464/metrics         # worker Prometheus scrape

      - name: Dump container logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v --remove-orphans || true

  images-local-smoke:
    name: Local image build smoke (CORE-DXL-001)
    runs-on: ubuntu-latest
    # CORE-DXL-001: `pnpm run images:local` is a thin, ADDITIVE convenience over the
    # base manifest's existing build stanzas that builds the three Core runtime images
    # from source to the stable local tags (livecore-{api,worker,migrations}:local), so
    # a downstream vertical can run an UNRELEASED Core through its own end-to-end test
    # harness WITHOUT a registry publish. The static half - the script is well-formed
    # and additive, the manifest still tags the three :local images, and the README
    # documents the contract - is asserted no-Docker by scripts/test-images-local.ps1.
    # This job proves the real half:
    #   1. the script PRODUCES the three :local images (docker image inspect),
    #   2. a re-run REBUILDS IDEMPOTENTLY (same tags, exit 0), and
    #   3. the api answers GET /health/ready when run from the :local image (the base
    #      manifest brought up with --no-build, i.e. on the images the script built).
    # It adds no publish/release step, so the released ghcr image-publish path is unchanged.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable Corepack (pinned pnpm)
        run: corepack enable pnpm

      - name: Validate the images:local script + contract (no Docker)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-images-local.ps1

      - name: Build the three Core images from source to :local (pnpm run images:local)
        run: pnpm run images:local

      - name: The three :local image tags exist (docker image inspect)
        run: |
          set -euo pipefail
          for tag in livecore-api:local livecore-worker:local livecore-migrations:local; do
            docker image inspect --format '{{ .Id }}' "$tag" > /dev/null
            echo "OK: $tag exists."
          done

      - name: A re-run rebuilds idempotently (same :local tags, exit 0)
        run: |
          set -euo pipefail
          pnpm run images:local
          for tag in livecore-api:local livecore-worker:local livecore-migrations:local; do
            docker image inspect --format '{{ .Id }}' "$tag" > /dev/null
            echo "OK: $tag still exists after the idempotent re-run."
          done

      - name: Run the :local images and assert the api answers /health/ready
        working-directory: deploy/compose
        # --no-build: do NOT rebuild; run on exactly the :local images the script built
        # (postgres is pulled). The migrate gate applies the schema, then the api comes
        # up and /health/ready turns green once the schema is current.
        run: docker compose up -d --no-build

      - name: The documented health probes answer 200 from the :local image
        run: |
          set -euo pipefail
          probe() {
            local url="$1"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --output /dev/null "$url"; then
                echo "OK: $url answered after $attempt attempt(s)."
                return 0
              fi
              sleep 1
            done
            echo "FAILED: $url did not answer 200 in time."
            return 1
          }
          probe http://localhost:8080/health/ready    # API readiness, from livecore-api:local
          probe http://localhost:8080/health/live     # API liveness, from livecore-api:local

      - name: Dump container logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v --remove-orphans || true

  compose-full-smoke:
    name: Full local stack smoke (CORE-DEP-006)
    runs-on: ubuntu-latest
    # CORE-DEP-006: the OPTIONAL full-stack overlay (deploy/compose/docker-compose.full.yml)
    # brings the Core up together with an OIDC provider (Keycloak), S3-compatible object
    # storage (RustFS) and a Redis/Valkey backplane, PRE-WIRED so an operator or a vertical
    # author can run the platform end-to-end locally (authenticated traffic, asset
    # upload/download, multi-instance realtime) without standing up external services by
    # hand. The static half - that the overlay wires the OIDC/storage/backplane services and
    # the api/worker reference them - is asserted by scripts/test-compose-deploy.ps1 in the
    # compose-smoke job. This job proves the overlay STARTS (the "or a documented subset"
    # half of the acceptance criteria - here the full profile):
    #   1. RENDERS: `docker compose -f base -f overlay config` merges cleanly.
    #   2. STARTS + GATE: brings the merged stack up; the base migrate-before-API gate still
    #      holds and the api/worker come up wired to keycloak/rustfs/valkey.
    #   3. PROBES: the documented health/readiness/liveness endpoints answer 200. Crucially
    #      /health/ready is green ONLY when the configured OIDC, object-storage and backplane
    #      dependencies are all REACHABLE (the deep readiness probes, CORE-OBS-009), so a
    #      green readiness proves the full stack is wired together end-to-end.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Render the merged full-stack overlay
        working-directory: deploy/compose
        run: docker compose -f docker-compose.yml -f docker-compose.full.yml config

      - name: Start the full local stack (postgres -> migrate gate -> api + worker, plus keycloak + rustfs + valkey)
        working-directory: deploy/compose
        run: docker compose -f docker-compose.yml -f docker-compose.full.yml up -d --build

      - name: The migrations runner ran to completion (exit 0)
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          migrate_cid="$(docker compose -f docker-compose.yml -f docker-compose.full.yml ps -aq migrate)"
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$migrate_cid")"
          echo "migrate exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            docker compose -f docker-compose.yml -f docker-compose.full.yml logs migrate
            echo "Migrations runner did not exit 0."
            exit 1
          fi

      - name: The documented probes answer 200 (readiness is green only when OIDC + storage + backplane are reachable)
        run: |
          set -euo pipefail
          probe() {
            local url="$1"
            local attempts="$2"
            for attempt in $(seq 1 "$attempts"); do
              if curl --fail --silent --output /dev/null "$url"; then
                echo "OK: $url answered after $attempt attempt(s)."
                return 0
              fi
              sleep 2
            done
            echo "FAILED: $url did not answer 200 in time."
            return 1
          }
          # Liveness/metrics come up with the process; readiness waits for the deep OIDC/
          # storage/backplane reachability probes, so give it a generous budget (the OIDC
          # realm import is the slowest step) — its success is the end-to-end wiring proof.
          probe http://localhost:8080/health/live  30    # API liveness
          probe http://localhost:9464/health/live  30    # worker per-loop heartbeat liveness
          probe http://localhost:9464/metrics      30    # worker Prometheus scrape
          probe http://localhost:8080/health/ready 90    # API readiness (OIDC + storage + backplane reachable)

      - name: Dump container logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose -f docker-compose.yml -f docker-compose.full.yml logs

      - name: Tear down the stack
        if: always()
        working-directory: deploy/compose
        run: docker compose -f docker-compose.yml -f docker-compose.full.yml down -v --remove-orphans || true

  helm-chart:
    name: Helm chart render and schema validation (CORE-DEP-004)
    runs-on: ubuntu-latest
    # CORE-DEP-004: the Core ships a Kubernetes Helm chart at deploy/helm/livecore
    # (the third production option in docs/13) that MIRRORS the migrate-before-API
    # contract the Compose stack enforces (CORE-DEP-001). The two easy-to-get-wrong
    # pieces - the migrate-before-API gate (a pre-install/pre-upgrade hook Job that
    # must succeed before the API/worker roll out) and the documented liveness/
    # readiness probes - plus the no-baked-secret rule are proven two ways:
    #   1. RENDERS/VALIDATES (no tooling): scripts/test-helm-chart.ps1 proves the
    #      validation logic over fixtures (a chart that drops the pre-install hook, a
    #      probe, or that hardcodes a secret is rejected) and guards the real chart.
    #   2. LINT + RENDER + SCHEMA: helm lint, then helm template renders the chart and
    #      kubeconform schema-validates every rendered manifest; shell assertions then
    #      confirm the rendered output carries the pre-install/pre-upgrade migrate Job,
    #      the /health/live + /health/ready probes, and that every Secret value renders
    #      empty (no hardcoded secret).
    #   3. MULTI-REPLICA FAIL-SAFE (CORE-DEP-009): the default install renders a single
    #      API replica; a replicaCount > 1 render FAILS when no realtime backplane is
    #      configured (citing the guard) and SUCCEEDS (kubeconform-valid, no warning)
    #      once the backplane is set, and the documented HA topology (replicas +
    #      backplane + sticky sessions) renders cleanly.
    #   4. RESOURCE CEILINGS (CORE-DEP-007/CORE-DEP-010): every rendered Pod template
    #      (the migrate Job, the API and the worker Deployment) carries a non-empty
    #      resources.requests AND resources.limits (cpu + memory) by default, mirroring
    #      the Compose ceiling, and a values override changes the rendered numbers.
    #   5. STICKY-SESSION AFFINITY (CORE-DEP-013/CORE-DEP-002): with the Ingress enabled
    #      and api.replicaCount > 1 the rendered Ingress carries the cookie session-affinity
    #      annotations automatically (so SignalR's negotiate + transport handshake stays
    #      pinned to one replica); the single-replica default carries none, and the auto
    #      affinity is opt-out for a WebSockets-only transport.
    #   6. OPTIONAL API HPA (CORE-DEP-011): the default render carries no
    #      HorizontalPodAutoscaler; enabling autoscaling renders a schema-valid HPA targeting
    #      the API Deployment (and the Deployment yields its static replicas to the HPA); and
    #      enabling autoscaling without a backplane trips the CORE-DEP-009 guard, since an HPA
    #      can scale the API past one pod.
    #   7. DISRUPTION BUDGETS (CORE-DEP-012): the single-replica default renders no
    #      PodDisruptionBudget (so a lone pod's node can still drain); a multi-replica API
    #      (or an enabled HPA) renders a schema-valid PDB that selects the API pods and keeps
    #      at least one available (maxUnavailable: 1), the budget is overridable to a
    #      minAvailable floor and opt-out, and the worker gets a symmetric PDB.
    #   8. SECURE-BY-DEFAULT HOST FILTER + FORWARDED HEADERS (CORE-SEC-010): the default render
    #      does NOT carry an empty allow-all AllowedHosts (ASP.NET treats empty/"*" as allow-all);
    #      the ConfigMap renders a non-empty host allow-list, an operator override is honored and
    #      keeps the loopback hosts the in-pod probes use, the probes send a loopback Host header,
    #      and the ForwardedHeaders KnownProxies/KnownNetworks requirement (and its rate-limit
    #      single-bucket consequence) is documented.
    # Tooling justification: helm (the chart renderer/linter) and kubeconform (the
    # Kubernetes-schema validator) are installed from PINNED release binaries via curl
    # - the same "pin the tool, add no extra GitHub Action to the supply chain"
    # pattern the promtool/Trivy/cosign installs already use - so no new repository
    # dependency or workflow action enters the build.
    env:
      HELM_VERSION: v3.16.4
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate the chart logic and guard the real chart (no tooling)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-helm-chart.ps1

      - name: Install Helm (pinned release binary)
        run: |
          set -euo pipefail
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          tar -xzf helm.tar.gz
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tar.gz linux-amd64
          helm version

      - name: Install kubeconform (pinned release binary)
        run: |
          set -euo pipefail
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          rm -f kubeconform.tar.gz kubeconform
          kubeconform -v

      - name: helm lint
        run: helm lint deploy/helm/livecore

      - name: helm template (render) and kubeconform (schema-validate)
        run: |
          set -euo pipefail
          helm template livecore deploy/helm/livecore > rendered.yaml
          # Also render with the (default-off) Ingress enabled so its schema is
          # validated too; the assertions below run over the default render.
          helm template livecore deploy/helm/livecore --set ingress.enabled=true > rendered-ingress.yaml
          echo "Rendered manifests:"
          grep -E '^(kind|# Source):' rendered.yaml || true
          # Schema-validate every rendered manifest against the Kubernetes schemas.
          kubeconform -strict -summary -schema-location default rendered.yaml
          kubeconform -strict -summary -schema-location default rendered-ingress.yaml

      - name: Assert the migrate-before-API gate, the probes and no hardcoded secret
        run: |
          set -euo pipefail
          rendered="$(cat rendered.yaml)"
          # 1. The migrations runner is a pre-install/pre-upgrade hook Job (the gate).
          echo "$rendered" | grep -Eq '"?helm\.sh/hook"?:[[:space:]]*pre-install,pre-upgrade' \
            || { echo "MISSING: pre-install/pre-upgrade migrate Job hook"; exit 1; }
          echo "$rendered" | grep -Eq '^[[:space:]]*kind:[[:space:]]*Job[[:space:]]*$' \
            || { echo "MISSING: migrate Job"; exit 1; }
          # 2. The documented liveness/readiness probes are wired.
          echo "$rendered" | grep -Eq 'path:[[:space:]]*/health/live' \
            || { echo "MISSING: /health/live liveness probe"; exit 1; }
          echo "$rendered" | grep -Eq 'path:[[:space:]]*/health/ready' \
            || { echo "MISSING: /health/ready readiness probe"; exit 1; }
          # 3. No hardcoded secret: every Secret value renders empty by default.
          for key in ConnectionStrings__Database Assets__Storage__AccessKeyId Assets__Storage__SecretAccessKey Realtime__Backplane__ConnectionString; do
            if echo "$rendered" | grep -Eq "^[[:space:]]*${key}:[[:space:]]*\"\"[[:space:]]*$"; then
              echo "OK: secret $key renders empty (not baked into the chart)"
            else
              echo "HARDCODED SECRET (or missing key): $key does not render as an empty value"
              exit 1
            fi
          done
          echo "Helm chart: migrate-before-API gate, probes and no-baked-secret all asserted on the rendered manifests."

      - name: Assert resource requests/limits on every Pod template, and overridability (CORE-DEP-010)
        run: |
          set -euo pipefail
          chart=deploy/helm/livecore
          # CORE-DEP-007/CORE-DEP-010: the migrate Job, the API Deployment and the
          # worker Deployment must each render a non-empty resources.requests AND
          # resources.limits (cpu + memory) by default, so the resource-ceiling
          # guarantee holds on Kubernetes, not only on Compose. Each rendered template
          # has exactly one container, so its single resources block carries the two
          # cpu and two memory quantities (one each under requests and limits).
          for tpl in migrate-job api-deployment worker-deployment; do
            manifest="$(helm template livecore "$chart" --show-only "templates/${tpl}.yaml")"
            echo "$manifest" | grep -Eq '^[[:space:]]*resources:'  || { echo "MISSING: $tpl has no resources block";   exit 1; }
            echo "$manifest" | grep -Eq '^[[:space:]]*requests:'    || { echo "MISSING: $tpl resources.requests";       exit 1; }
            echo "$manifest" | grep -Eq '^[[:space:]]*limits:'      || { echo "MISSING: $tpl resources.limits";         exit 1; }
            [ "$(echo "$manifest" | grep -Ec '^[[:space:]]*cpu:[[:space:]]*[^[:space:]]')"    -ge 2 ] || { echo "MISSING: $tpl requests+limits cpu";    exit 1; }
            [ "$(echo "$manifest" | grep -Ec '^[[:space:]]*memory:[[:space:]]*[^[:space:]]')" -ge 2 ] || { echo "MISSING: $tpl requests+limits memory"; exit 1; }
            echo "OK: $tpl carries resources.requests + resources.limits (cpu + memory)"
          done

          # The ceilings are OVERRIDABLE: a values override changes the rendered limit.
          # toYaml emits the resources map with keys sorted alphabetically (limits before
          # requests), so prove the override by its VALUE rather than by the order of the
          # cpu: lines: 2500m must be absent by default and present under --set.
          helm template livecore "$chart" --show-only templates/api-deployment.yaml > res-default.yaml
          helm template livecore "$chart" --set api.resources.limits.cpu=2500m --show-only templates/api-deployment.yaml > res-override.yaml
          if grep -Eq '^[[:space:]]*cpu:[[:space:]]*2500m([[:space:]]|$)' res-default.yaml; then
            echo "OVERRIDE: cpu 2500m already present by default - cannot prove the override"; exit 1
          fi
          grep -Eq '^[[:space:]]*cpu:[[:space:]]*2500m([[:space:]]|$)' res-override.yaml \
            || { echo "OVERRIDE: api.resources.limits.cpu=2500m did not render"; cat res-override.yaml; exit 1; }
          echo "OK: api.resources.limits.cpu is overridable (2500m renders only under --set)"

      - name: Assert the multi-replica realtime-backplane fail-safe (CORE-DEP-009)
        run: |
          set -euo pipefail
          chart=deploy/helm/livecore
          backplane='secrets.Realtime__Backplane__ConnectionString=redis://valkey:6379'

          # The DEFAULT install runs a single API replica (no silent multi-replica on
          # the in-process backplane).
          [ "$(helm template livecore "$chart" --show-only templates/api-deployment.yaml | grep -E '^[[:space:]]*replicas:' | grep -Eo '[0-9]+')" = "1" ] \
            || { echo "MISSING: the default api Deployment must request a single replica"; exit 1; }
          echo "OK: the default install runs a single API replica"

          # replicaCount=1 renders cleanly and schema-validates.
          helm template livecore "$chart" --set api.replicaCount=1 > rc1.yaml
          kubeconform -strict -summary -schema-location default rc1.yaml
          echo "OK: replicaCount=1 renders and schema-validates"

          # replicaCount>1 with an EMPTY backplane MUST FAIL the render (fail-safe), and
          # the failure must cite the CORE-DEP-009 guard.
          if helm template livecore "$chart" --set api.replicaCount=2 > multi-empty.yaml 2> multi-empty.err; then
            echo "EXPECTED FAILURE: replicaCount=2 with no backplane rendered successfully"
            cat multi-empty.yaml
            exit 1
          fi
          grep -q 'CORE-DEP-009' multi-empty.err \
            || { echo "MISSING: the render failure does not cite the CORE-DEP-009 backplane guard"; cat multi-empty.err; exit 1; }
          echo "OK: replicaCount=2 with no backplane fails the render and cites the guard"

          # replicaCount>1 WITH a configured backplane renders, schema-validates and
          # emits no warning in the manifests.
          helm template livecore "$chart" --set api.replicaCount=2 --set-string "$backplane" > multi-backplane.yaml
          kubeconform -strict -summary -schema-location default multi-backplane.yaml
          if grep -qi 'WARNING' multi-backplane.yaml; then
            echo "UNEXPECTED: a configured multi-replica backplane render emitted a warning"
            grep -i 'WARNING' multi-backplane.yaml
            exit 1
          fi
          echo "OK: replicaCount=2 with a configured backplane renders, schema-validates and warns nothing"

          # The documented HA topology (replicas + backplane + sticky sessions) renders cleanly.
          helm template livecore "$chart" \
            --set api.replicaCount=3 \
            --set-string "$backplane" \
            --set ingress.enabled=true \
            --set-string 'ingress.annotations.nginx\.ingress\.kubernetes\.io/affinity=cookie' > ha.yaml
          kubeconform -strict -summary -schema-location default ha.yaml
          echo "OK: the documented HA topology (replicas + backplane + sticky sessions) renders and schema-validates"

      - name: Assert SignalR sticky-session affinity for multi-replica realtime (CORE-DEP-013)
        run: |
          set -euo pipefail
          chart=deploy/helm/livecore
          backplane='secrets.Realtime__Backplane__ConnectionString=redis://valkey:6379'

          # CORE-DEP-013/CORE-DEP-002: a multi-replica API serving SignalR needs each client's
          # negotiate + transport handshake pinned to the replica that issued its connectionId
          # (the hub keeps the full transport set; it does not force WebSockets-only). With the
          # Ingress enabled and api.replicaCount > 1 the chart renders the cookie session-affinity
          # annotations automatically; the single-replica default must carry none.

          # The grep patterns anchor to the start of a rendered annotation line
          # (^<spaces>nginx...), so the template's leading "# ... non-nginx ..." comment
          # text can never be mistaken for a rendered annotation.

          # (a) Single replica (default) + ingress: NO affinity annotation (default path unaffected).
          helm template livecore "$chart" --set ingress.enabled=true --show-only templates/ingress.yaml > ingress-single.yaml
          kubeconform -strict -summary -schema-location default ingress-single.yaml
          if grep -Eq '^[[:space:]]*nginx\.ingress\.kubernetes\.io/affinity:' ingress-single.yaml; then
            echo "UNEXPECTED: the single-replica Ingress carries a session-affinity annotation"; cat ingress-single.yaml; exit 1
          fi
          echo "OK: the default single-replica Ingress carries no session-affinity annotation"

          # (b) Multi-replica (with backplane) + ingress: the cookie affinity annotation renders.
          helm template livecore "$chart" --set api.replicaCount=2 --set-string "$backplane" --set ingress.enabled=true --show-only templates/ingress.yaml > ingress-multi.yaml
          kubeconform -strict -summary -schema-location default ingress-multi.yaml
          grep -Eq '^[[:space:]]*nginx\.ingress\.kubernetes\.io/affinity:[[:space:]]*"?cookie"?' ingress-multi.yaml \
            || { echo "MISSING: the multi-replica Ingress does not carry the cookie session-affinity annotation"; cat ingress-multi.yaml; exit 1; }
          echo "OK: the multi-replica Ingress carries the cookie session-affinity annotation"

          # (c) The auto affinity is opt-out (a WebSockets-only client transport, or a non-nginx controller).
          helm template livecore "$chart" --set api.replicaCount=2 --set-string "$backplane" --set ingress.enabled=true --set ingress.sessionAffinity.enabled=false --show-only templates/ingress.yaml > ingress-optout.yaml
          kubeconform -strict -summary -schema-location default ingress-optout.yaml
          if grep -Eq '^[[:space:]]*nginx\.ingress\.kubernetes\.io/affinity:' ingress-optout.yaml; then
            echo "UNEXPECTED: ingress.sessionAffinity.enabled=false still rendered the affinity annotation"; cat ingress-optout.yaml; exit 1
          fi
          echo "OK: ingress.sessionAffinity.enabled=false opts out of the auto affinity annotation (the WebSockets-only path)"

      - name: Assert the optional API HorizontalPodAutoscaler (CORE-DEP-011)
        run: |
          set -euo pipefail
          chart=deploy/helm/livecore
          backplane='secrets.Realtime__Backplane__ConnectionString=redis://valkey:6379'

          # CORE-DEP-011: the chart ships an OPTIONAL HorizontalPodAutoscaler for the API,
          # disabled by default. The default render carries no HPA; enabling it renders a
          # schema-valid HPA targeting the API Deployment; and because an HPA can scale the
          # API past one pod, enabling it implies the CORE-DEP-009 backplane requirement.

          # (a) The DEFAULT install renders NO HorizontalPodAutoscaler.
          helm template livecore "$chart" > rendered-default-hpa.yaml
          if grep -Eq '^[[:space:]]*kind:[[:space:]]*HorizontalPodAutoscaler[[:space:]]*$' rendered-default-hpa.yaml; then
            echo "UNEXPECTED: the default render contains a HorizontalPodAutoscaler"; exit 1
          fi
          echo "OK: the default install renders no HPA (autoscaling is opt-in)"

          # (b) Enabling autoscaling WITHOUT a backplane FAILS the render, citing CORE-DEP-009
          #     (an HPA can scale the API past one pod, so it carries the multi-replica
          #     realtime requirement just like api.replicaCount > 1).
          if helm template livecore "$chart" --set autoscaling.enabled=true > hpa-empty.yaml 2> hpa-empty.err; then
            echo "EXPECTED FAILURE: autoscaling.enabled=true with no backplane rendered successfully"; cat hpa-empty.yaml; exit 1
          fi
          grep -q 'CORE-DEP-009' hpa-empty.err \
            || { echo "MISSING: enabling autoscaling without a backplane must cite the CORE-DEP-009 guard"; cat hpa-empty.err; exit 1; }
          echo "OK: autoscaling without a backplane fails the render and cites CORE-DEP-009"

          # (c) Enabling autoscaling WITH a backplane renders a schema-valid HPA that targets
          #     the API Deployment, and the Deployment then omits its static replicas (the HPA
          #     owns the replica count).
          helm template livecore "$chart" --set autoscaling.enabled=true --set-string "$backplane" --show-only templates/api-hpa.yaml > hpa.yaml
          kubeconform -strict -summary -schema-location default hpa.yaml
          grep -Eq '^[[:space:]]*kind:[[:space:]]*HorizontalPodAutoscaler[[:space:]]*$' hpa.yaml \
            || { echo "MISSING: the enabled render does not contain a HorizontalPodAutoscaler"; cat hpa.yaml; exit 1; }
          # The HPA's scaleTargetRef must point at the API Deployment (livecore-api).
          grep -Eq '^[[:space:]]*kind:[[:space:]]*Deployment[[:space:]]*$' hpa.yaml \
            || { echo "MISSING: the HPA scaleTargetRef does not reference a Deployment"; cat hpa.yaml; exit 1; }
          grep -Eq '^[[:space:]]*name:[[:space:]]*livecore-api[[:space:]]*$' hpa.yaml \
            || { echo "MISSING: the HPA scaleTargetRef does not reference the API Deployment (livecore-api)"; cat hpa.yaml; exit 1; }
          echo "OK: enabling autoscaling renders a schema-valid HPA targeting the API Deployment"

          # The whole-chart render with autoscaling enabled also schema-validates (HPA + the rest).
          helm template livecore "$chart" --set autoscaling.enabled=true --set-string "$backplane" > autoscaling-full.yaml
          kubeconform -strict -summary -schema-location default autoscaling-full.yaml
          # The API Deployment must omit its static replicas so the HPA owns the count.
          if helm template livecore "$chart" --set autoscaling.enabled=true --set-string "$backplane" --show-only templates/api-deployment.yaml | grep -Eq '^[[:space:]]*replicas:'; then
            echo "UNEXPECTED: the API Deployment still sets a static replicas while autoscaling is enabled"; exit 1
          fi
          echo "OK: the autoscaling render schema-validates and the API Deployment yields replica control to the HPA"

      - name: Assert the PodDisruptionBudget for the API and worker (CORE-DEP-012)
        run: |
          set -euo pipefail
          chart=deploy/helm/livecore
          backplane='secrets.Realtime__Backplane__ConnectionString=redis://valkey:6379'

          # CORE-DEP-012: a voluntary disruption (a node drain / cluster upgrade) must not be
          # able to evict ALL API replicas at once - with replicaCount 2 and no PDB a drain can
          # take both pods down, a full outage. The chart ships a PodDisruptionBudget for the API
          # (and a symmetric one for the worker), rendered only when the component can actually run
          # more than one pod, so the single-replica default is never blocked from draining
          # ("safe at replicaCount 1"). The grep patterns anchor to the start of a rendered line so
          # the templates' leading comment text can never be mistaken for rendered content.

          # (a) The DEFAULT install (single API + single worker) renders NO PodDisruptionBudget -
          #     a PDB over a lone pod would block its node from ever draining.
          helm template livecore "$chart" > pdb-default.yaml
          if grep -Eq '^[[:space:]]*kind:[[:space:]]*PodDisruptionBudget[[:space:]]*$' pdb-default.yaml; then
            echo "UNEXPECTED: the single-replica default render contains a PodDisruptionBudget"; cat pdb-default.yaml; exit 1
          fi
          echo "OK: the single-replica default renders no PDB (safe at replicaCount 1)"

          # (b) A multi-replica API (with the backplane) renders a schema-valid PDB that SELECTS
          #     the API pods and KEEPS AT LEAST ONE AVAILABLE (the default maxUnavailable: 1, so
          #     >= 1 of 2 stays up under a voluntary disruption).
          helm template livecore "$chart" --set api.replicaCount=2 --set-string "$backplane" --show-only templates/api-pdb.yaml > pdb-api.yaml
          kubeconform -strict -summary -schema-location default pdb-api.yaml
          grep -Eq '^[[:space:]]*kind:[[:space:]]*PodDisruptionBudget[[:space:]]*$' pdb-api.yaml \
            || { echo "MISSING: the multi-replica API render contains no PodDisruptionBudget"; cat pdb-api.yaml; exit 1; }
          grep -Eq '^[[:space:]]*app\.kubernetes\.io/component:[[:space:]]*api[[:space:]]*$' pdb-api.yaml \
            || { echo "MISSING: the API PDB does not select the API pods (component: api)"; cat pdb-api.yaml; exit 1; }
          grep -Eq '^[[:space:]]*maxUnavailable:[[:space:]]*1[[:space:]]*$' pdb-api.yaml \
            || { echo "MISSING: the API PDB does not keep at least one pod available (maxUnavailable: 1)"; cat pdb-api.yaml; exit 1; }
          echo "OK: the multi-replica API PDB selects the API pods and keeps at least one available"

          # (c) Enabling autoscaling (an HPA can scale the API past one pod) also renders the API PDB.
          helm template livecore "$chart" --set autoscaling.enabled=true --set-string "$backplane" --show-only templates/api-pdb.yaml > pdb-hpa.yaml
          kubeconform -strict -summary -schema-location default pdb-hpa.yaml
          grep -Eq '^[[:space:]]*kind:[[:space:]]*PodDisruptionBudget[[:space:]]*$' pdb-hpa.yaml \
            || { echo "MISSING: enabling autoscaling did not render the API PDB"; cat pdb-hpa.yaml; exit 1; }
          echo "OK: enabling autoscaling renders the API PDB"

          # (d) The budget is OVERRIDABLE: setting minAvailable renders it INSTEAD of maxUnavailable
          #     (a PDB carries exactly one of the two).
          helm template livecore "$chart" --set api.replicaCount=3 --set-string "$backplane" --set api.podDisruptionBudget.minAvailable=2 --show-only templates/api-pdb.yaml > pdb-override.yaml
          kubeconform -strict -summary -schema-location default pdb-override.yaml
          grep -Eq '^[[:space:]]*minAvailable:[[:space:]]*2[[:space:]]*$' pdb-override.yaml \
            || { echo "OVERRIDE: api.podDisruptionBudget.minAvailable override did not render"; cat pdb-override.yaml; exit 1; }
          if grep -Eq '^[[:space:]]*maxUnavailable:' pdb-override.yaml; then
            echo "OVERRIDE: minAvailable was set but maxUnavailable still rendered (a PDB allows only one)"; cat pdb-override.yaml; exit 1
          fi
          echo "OK: the API PDB budget is overridable (minAvailable wins over the maxUnavailable default)"

          # (e) The PDB is opt-out: enabled=false renders none even when multi-replica.
          helm template livecore "$chart" --set api.replicaCount=2 --set-string "$backplane" --set api.podDisruptionBudget.enabled=false > pdb-optout.yaml
          if grep -Eq '^[[:space:]]*kind:[[:space:]]*PodDisruptionBudget[[:space:]]*$' pdb-optout.yaml; then
            echo "UNEXPECTED: api.podDisruptionBudget.enabled=false still rendered a PDB"; cat pdb-optout.yaml; exit 1
          fi
          echo "OK: api.podDisruptionBudget.enabled=false opts out of the API PDB"

          # (f) The worker PDB is symmetric: a multi-replica worker renders a schema-valid PDB that
          #     selects the worker pods; the single-worker default (asserted in (a)) renders none.
          helm template livecore "$chart" --set worker.replicaCount=2 --show-only templates/worker-pdb.yaml > pdb-worker.yaml
          kubeconform -strict -summary -schema-location default pdb-worker.yaml
          grep -Eq '^[[:space:]]*kind:[[:space:]]*PodDisruptionBudget[[:space:]]*$' pdb-worker.yaml \
            || { echo "MISSING: the multi-replica worker render contains no PodDisruptionBudget"; cat pdb-worker.yaml; exit 1; }
          grep -Eq '^[[:space:]]*app\.kubernetes\.io/component:[[:space:]]*worker[[:space:]]*$' pdb-worker.yaml \
            || { echo "MISSING: the worker PDB does not select the worker pods (component: worker)"; cat pdb-worker.yaml; exit 1; }
          echo "OK: a multi-replica worker renders a PDB selecting the worker pods"

      - name: Assert the secure-by-default host filter and forwarded-headers guidance (CORE-SEC-010)
        run: |
          set -euo pipefail
          chart=deploy/helm/livecore

          # CORE-SEC-010: the chart must not render an empty allow-all AllowedHosts host filter by
          # default - ASP.NET Core treats an empty (or "*") AllowedHosts as allow-all, turning
          # host-header validation OFF. The ConfigMap renders a non-empty allow-list through the
          # livecore.allowedHosts helper so host filtering is ON by default; the value is overridable
          # and always keeps the loopback hosts the in-pod liveness/readiness probes use, so a
          # restrictive real-host allow-list never rejects the kubelet probes.

          # (a) The DEFAULT render carries a NON-EMPTY (non-allow-all) AllowedHosts.
          ah="$(helm template livecore "$chart" --show-only templates/configmap.yaml | grep -E '^[[:space:]]*AllowedHosts:' | head -n1 | sed -E 's/^[[:space:]]*AllowedHosts:[[:space:]]*//')"
          [ -n "$ah" ] || { echo "MISSING: AllowedHosts not rendered into the ConfigMap"; exit 1; }
          case "$ah" in
            '""'|"''"|'"*"'|'*') echo "INSECURE: AllowedHosts renders allow-all ($ah)"; exit 1 ;;
          esac
          echo "OK: the default ConfigMap renders a non-empty (non-allow-all) AllowedHosts: $ah"

          # (b) An operator AllowedHosts override is honored AND the loopback probe hosts stay in the
          #     allow-list (so a restrictive real-host allow-list never rejects the kubelet probes,
          #     which send a localhost Host header - see the probe templates).
          ah_override="$(helm template livecore "$chart" --set-string config.AllowedHosts=app.example.com --show-only templates/configmap.yaml | grep -E '^[[:space:]]*AllowedHosts:' | head -n1)"
          echo "$ah_override" | grep -q 'app.example.com' || { echo "OVERRIDE: operator AllowedHosts not honored"; echo "$ah_override"; exit 1; }
          echo "$ah_override" | grep -q 'localhost'       || { echo "PROBE: loopback host dropped from AllowedHosts (would break the kubelet probes)"; echo "$ah_override"; exit 1; }
          echo "OK: an operator AllowedHosts override is honored and keeps the loopback probe host"

          # (c) The in-pod probes send a loopback Host header so the secure-by-default host filter
          #     admits them (the kubelet probes the dynamic pod IP, which no static allow-list names).
          for tpl in api-deployment worker-deployment; do
            helm template livecore "$chart" --show-only "templates/${tpl}.yaml" | grep -Eq '^[[:space:]]*-[[:space:]]*name:[[:space:]]*Host[[:space:]]*$' \
              || { echo "MISSING: $tpl probe does not send a Host header for the host filter"; exit 1; }
          done
          echo "OK: the API and worker probes send a loopback Host header for the host filter"

          # (d) The forwarded-headers KnownProxies/KnownNetworks requirement - and that without it the
          #     anonymous per-IP rate-limit partition collapses to a single bucket - is documented in
          #     the chart values.yaml and README.
          grep -Eq 'ForwardedHeaders__Known(Networks|Proxies)' deploy/helm/livecore/values.yaml \
            || { echo "MISSING: ForwardedHeaders KnownProxies/KnownNetworks not documented in values.yaml"; exit 1; }
          grep -Eiq 'rate.?limit' deploy/helm/livecore/README.md \
            || { echo "MISSING: README does not mention the rate-limit consequence of forwarded headers"; exit 1; }
          grep -Eiq 'single bucket|partition' deploy/helm/livecore/README.md \
            || { echo "MISSING: README does not document the rate-limit-partition collapse"; exit 1; }
          echo "OK: the forwarded-headers KnownProxies/KnownNetworks requirement and rate-limit-partition consequence are documented"

  observability-assets:
    name: Observability assets (alert rules, SLOs, dashboard) (CORE-OBS-008)
    runs-on: ubuntu-latest
    # CORE-OBS-008: the repo ships example Prometheus recording/alert rules, a
    # scrape config, documented SLO targets for the livecore_* series and a starter
    # Grafana dashboard under deploy/observability/, so a self-hoster gets
    # actionable alerting out of the box. This job validates them two ways:
    #   1. a pure-PowerShell gate (scripts/test-observability-assets.ps1) proves the
    #      validation logic over fixtures (an undocumented series reference, an alert
    #      with no severity, a malformed dashboard JSON are each rejected) and then
    #      guards the real files - every livecore_* series the rules and dashboard
    #      reference is a series documented in docs/15_OBSERVABILITY.md or a recording
    #      rule defined in the rules file, so the assets and the docs cannot drift;
    #   2. promtool (the canonical Prometheus validator, pinned release) runs
    #      `check config` over the scrape config and `check rules` over the
    #      recording/alert rules, and the dashboard JSON is parse-validated.
    # Pure docs/deploy assets, no application build needed.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test the observability-assets gate logic and guard the real files
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-observability-assets.ps1

      - name: Install promtool (pinned Prometheus release)
        run: |
          set -euo pipefail
          version=2.53.2
          curl -fsSL -o prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${version}/prometheus-${version}.linux-amd64.tar.gz"
          tar -xzf prometheus.tar.gz
          sudo install -m 0755 "prometheus-${version}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      - name: promtool check the scrape config and the alert/recording rules
        run: |
          set -euo pipefail
          promtool check config deploy/observability/prometheus/prometheus.yml
          promtool check rules deploy/observability/prometheus/rules/livecore.rules.yml

      - name: promtool unit-test the alert rules (backlog false-pass fixture)
        # CORE-OBS-015: prove the worker backlog alert fires on a steadily-growing
        # backlog that touches zero (where the old floor test false-passed) and does
        # not fire on a draining backlog, using synthetic series.
        run: |
          set -euo pipefail
          promtool test rules deploy/observability/prometheus/rules/livecore.rules.test.yml

      - name: Validate the starter Grafana dashboard JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content -Raw deploy/observability/grafana/dashboards/livecore-overview.json | ConvertFrom-Json | Out-Null
          Write-Host 'Grafana dashboard JSON is valid.'

  publish-dry-run:
    name: Publish dry-run (tags verified, images built, never pushed)
    runs-on: ubuntu-latest
    # CORE-OPS-009: proves the publish path on every push and pull request
    # without ever pushing. It verifies the tag derivation (immutable, versioned,
    # fail-closed off a release tag) and, when this is not a release tag, builds
    # the images with the derived reference to dry-run the publish build. On a
    # release tag the build steps are skipped because the real publish job runs.
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify image tags are immutable and versioned
        shell: pwsh
        run: ./scripts/test-image-tags.ps1

      - name: Test the image scan gate and SBOM validation logic (seeded critical CVE fails)
        # CORE-DEP-003: proves deterministically, with no Docker/registry, that a
        # seeded CRITICAL vulnerability blocks the publish, the failing severities
        # are configurable and only a usable SBOM is accepted. This is the
        # required "a seeded critical CVE fails the gate" test, run every push/PR.
        shell: pwsh
        run: ./scripts/test-image-scan.ps1

      - name: Test the cosign verification gate logic (a missing signature/attestation fails closed)
        # CORE-SEC-008: proves deterministically, with no Docker/registry/cosign,
        # that the publish path's `cosign verify` / `cosign verify-attestation`
        # decision fails closed when the signature or the CycloneDX SBOM
        # attestation is missing, empty, the wrong predicate type or malformed.
        # This is the required fail-closed proof, run every push/PR; the real
        # cosign round-trip runs below (dry-run) and in the publish job.
        shell: pwsh
        run: ./scripts/test-image-attestation.ps1

      - name: Test the release-tag-vs-package-version gate (a mismatching tag fails)
        # CORE-CMP-003: proves the publish gate logic with no registry I/O - a
        # release tag matching the four packages' shared version passes, and a
        # mismatching tag (or the packages out of lockstep) fails closed. This is
        # the required "a release tag mismatching the package version fails the
        # publish gate" test, run on every push and pull request; the real gate
        # runs against the actual tag in the publish job below.
        shell: pwsh
        run: ./scripts/test-release-version.ps1

      - name: Derive a release-shaped reference for the dry-run build
        id: tags
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          DRY_RUN_REF: refs/tags/v0.0.0-cidryrun
        run: ./scripts/derive-image-tags.ps1 -Ref $env:DRY_RUN_REF -Registry $env:REGISTRY -Owner $env:REPOSITORY_OWNER -OutputPath $env:GITHUB_OUTPUT

      - name: Dry-run build the API, worker and migrations images (built, never pushed)
        # CORE-OPS-015: the migrations runner image is built here on a pull request
        # (and any non-tag push) exactly as the api/worker images are, proving the
        # publish build path for it without ever pushing.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
          MIGRATIONS_REFERENCE: ${{ steps.tags.outputs.migrations }}
        run: |
          docker build --file apps/api/Dockerfile --tag "$API_REFERENCE" .
          docker build --file apps/worker/Dockerfile --tag "$WORKER_REFERENCE" .
          docker build --file apps/api/Migrations.Dockerfile --tag "$MIGRATIONS_REFERENCE" .
          echo "Dry-run built $API_REFERENCE, $WORKER_REFERENCE and $MIGRATIONS_REFERENCE; this job never logs in or pushes."

      - name: Install Trivy (SBOM generator and vulnerability scanner)
        # CORE-DEP-003: installs the Trivy CLI from its APT repository (the same
        # pattern the backup-restore-postgres job uses for the PostgreSQL client),
        # so no extra GitHub Action enters the supply chain.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Install cosign (keyless image signing and SBOM attestation, CORE-SEC-008)
        # CORE-SEC-008: install the cosign CLI from a pinned release binary - the
        # same "pin the tool, add no extra GitHub Action to the supply chain"
        # pattern the promtool and Trivy installs use. The dry-run signs with a
        # throwaway local key (no OIDC, no push); the release publish signs keyless
        # via the job's GitHub OIDC id-token.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          COSIGN_VERSION: v2.4.3
        run: |
          set -euo pipefail
          curl -fsSL -o cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          sudo install -m 0755 cosign /usr/local/bin/cosign
          rm -f cosign
          cosign version

      - name: Produce an SBOM and a CVE scan, and fail the PR on a critical vulnerability (CORE-DEP-005)
        # CORE-DEP-003 required test: the publish dry-run produces an SBOM and a
        # scan report. CORE-DEP-005 promotes this PR-time image CVE scan from
        # report-only to BLOCKING on critical: the gate now runs without
        # -ReportOnly, so a CRITICAL vulnerability (for example a known-CVE base
        # image) or a missing/empty SBOM fails the pull request here, the same
        # critical-only bar the release publish job enforces. Bump the pinned base
        # image digest (apps/*/Dockerfile) to clear a flagged base-image CVE.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
          MIGRATIONS_REFERENCE: ${{ steps.tags.outputs.migrations }}
        run: |
          set -euo pipefail
          for entry in "api=$API_REFERENCE" "worker=$WORKER_REFERENCE" "migrations=$MIGRATIONS_REFERENCE"; do
            name="${entry%%=*}"
            reference="${entry#*=}"
            trivy image --format cyclonedx --output "$name.sbom.cdx.json" "$reference"
            trivy image --format json --output "$name.scan.json" "$reference"
            pwsh -NoProfile -File scripts/assert-image-scan.ps1 \
              -ReportPath "$name.scan.json" -SbomPath "$name.sbom.cdx.json"
          done

      - name: Sign, attest and verify the dry-run images against a locally-built digest (no push)
        # CORE-SEC-008 required test, mirrored in the dry-run: prove the publish
        # signature + SBOM-attestation round-trip end to end against a LOCALLY-built
        # digest with a throwaway key, never pushing to the real registry. A
        # throwaway local registry holds the image and the cosign artifacts; the run
        # signs each image, attaches its CycloneDX SBOM (reusing the SBOM produced
        # above) as an attestation, then runs `cosign verify` / `cosign
        # verify-attestation` and the fail-closed gate over their output. A final
        # negative check proves an UNSIGNED image fails verification (fail-closed),
        # the same posture the publish job enforces against the published digest.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
          MIGRATIONS_REFERENCE: ${{ steps.tags.outputs.migrations }}
          # A throwaway, password-less key generated for this run only; the release
          # publish never uses a key (it signs keyless via OIDC).
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          # A throwaway local registry to hold the images and the cosign signatures
          # and attestations - nothing is pushed to ghcr.io.
          docker run -d --rm -p 5000:5000 --name dryrun-registry registry:2
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5000/v2/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          # A throwaway key pair, generated for this run only (never committed and
          # never used for a real publish).
          cosign generate-key-pair
          for entry in "api=$API_REFERENCE" "worker=$WORKER_REFERENCE" "migrations=$MIGRATIONS_REFERENCE"; do
            name="${entry%%=*}"
            reference="${entry#*=}"
            local_ref="localhost:5000/livecore-$name:dryrun"
            docker tag "$reference" "$local_ref"
            docker push "$local_ref"
            digest="$(docker inspect --format '{{ index .RepoDigests 0 }}' "$local_ref" | cut -d@ -f2)"
            pinned="localhost:5000/livecore-$name@$digest"
            # Local key, no transparency log: keep the dry-run hermetic (the release
            # publish signs keyless and DOES record a Rekor entry). --tlog-upload on
            # sign/attest and --insecure-ignore-tlog on verify keep it offline.
            cosign sign --yes --tlog-upload=false --key cosign.key "$pinned"
            cosign attest --yes --tlog-upload=false --key cosign.key --predicate "$name.sbom.cdx.json" --type cyclonedx "$pinned"
            cosign verify --key cosign.pub --insecure-ignore-tlog=true "$pinned" --output json > "$name.sig.json"
            cosign verify-attestation --key cosign.pub --insecure-ignore-tlog=true --type cyclonedx "$pinned" --output json > "$name.att.json"
            pwsh -NoProfile -File scripts/assert-image-attestation.ps1 \
              -SignatureVerificationPath "$name.sig.json" -AttestationVerificationPath "$name.att.json" -PredicateType cyclonedx
          done
          # Fail-closed proof on the real path: an UNSIGNED image must NOT verify.
          docker tag "$API_REFERENCE" localhost:5000/livecore-unsigned:dryrun
          docker push localhost:5000/livecore-unsigned:dryrun
          unsigned_digest="$(docker inspect --format '{{ index .RepoDigests 0 }}' localhost:5000/livecore-unsigned:dryrun | cut -d@ -f2)"
          if cosign verify --key cosign.pub --insecure-ignore-tlog=true "localhost:5000/livecore-unsigned@$unsigned_digest" > /dev/null 2>&1; then
            echo "Expected cosign verify to FAIL closed on an unsigned image, but it passed."
            exit 1
          fi
          echo "cosign verify failed closed on the unsigned image, as required."
          docker rm -f dryrun-registry > /dev/null 2>&1 || true
          rm -f cosign.key cosign.pub

      - name: Scan the dry-run SBOMs for disallowed/unknown licenses (report-only, CORE-LIC-003)
        # CORE-LIC-003: the license-compliance gate reuses the CycloneDX SBOM produced
        # above (no extra scan) and is fail-closed on a disallowed or unknown license.
        # Report-only here so a not-yet-allow-listed transitive license documents
        # itself on a pull request without blocking development; the publish job runs
        # the same gate over the real SBOM.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          for name in api worker migrations; do
            pwsh -NoProfile -File scripts/assert-license-compliance.ps1 \
              -SbomPath "$name.sbom.cdx.json" -ReportOnly
          done

      - name: Upload the dry-run SBOMs and scan reports
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-dry-run
          path: |
            api.sbom.cdx.json
            api.scan.json
            worker.sbom.cdx.json
            worker.scan.json
            migrations.sbom.cdx.json
            migrations.scan.json
          if-no-files-found: error

  publish-packages-dry-run:
    name: Package publish dry-run (packs all four, never pushes)
    runs-on: ubuntu-latest
    # CORE-PUB-002: proves the npm publish path for the four @livecore packages on
    # every push and pull request without publishing. It first runs the
    # publish-gate logic test - a release tag that disagrees with the packages'
    # shared version, packages out of lockstep, or a republish of an existing
    # version all fail closed - and then dry-runs the publish, building and packing
    # all four packages (pnpm publish --dry-run, which rewrites the workspace:*
    # dependency to the resolved version) without contacting the registry. The real
    # publish-packages job runs the same gate against the actual release tag.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable Corepack (pinned pnpm)
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the package-publish gate logic (mismatch, lockstep break and republish fail closed)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-package-publish.ps1

      - name: Build packages
        run: pnpm --recursive run build

      - name: Dry-run publish all four packages (built and packed, never pushed)
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          # On a release tag dry-run against that exact tag; otherwise dry-run
          # against the current shared package version so the pipeline is proven on
          # every push and pull request. The gate still asserts tag == shared
          # version (and lockstep) before any package is packed.
          $ref = $env:GIT_REF
          if (-not $ref.StartsWith('refs/tags/v')) {
            Import-Module ./scripts/LiveCoreReleaseVersion.psm1 -Force
            $version = Get-LiveCorePackageVersion -RepositoryRoot (Get-Location).Path
            $ref = "refs/tags/v$version"
          }
          pwsh -NoProfile -File scripts/publish-packages.ps1 -Ref $ref -DryRun

  powershell-lint:
    name: PowerShell script analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run PSScriptAnalyzer on scripts/
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Bootstrap the module source so Install-Module can resolve PSScriptAnalyzer
          # even when the runner's NuGet provider / PSGallery registration is cold
          # (the transient "No match was found for ... 'PSScriptAnalyzer'" install flake).
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -ErrorAction SilentlyContinue | Out-Null
          # Install with a few retries to ride out a transient gallery/network blip.
          $installed = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
              $installed = $true
              break
            }
            catch {
              Write-Host "PSScriptAnalyzer install attempt $attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $installed) { Write-Error 'Could not install PSScriptAnalyzer after 4 attempts.'; exit 1 }
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          # Excluded rules (with rationale):
          # - PSAvoidUsingWriteHost: the scan/backup scripts are console tools and
          #   Write-Host targets the host information stream by design (PowerShell 5+).
          # - PSAvoidUsingPlainTextForPassword: the backup-encryption passphrase and
          #   database password are interfaces to PBKDF2/external tooling; PowerShell
          #   must materialize them as bytes to derive the key, so a SecureString
          #   would be converted straight back to plaintext. The -*PassphraseFile
          #   parameters are the recommended secure path (CORE-DR-001).
          # - PSUseSingularNouns: the crypto helpers use deliberately descriptive
          #   plural nouns (Test-LiveCoreFixedTimeEquals mirrors .NET
          #   CryptographicOperations.FixedTimeEquals; Read-LiveCoreExactBytes);
          #   singularizing them would make the names misleading.
          $findings = @(Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost, PSAvoidUsingPlainTextForPassword, PSUseSingularNouns)
          if ($findings.Count -gt 0) {
            $findings |
              Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize |
              Out-String -Width 220 |
              Write-Output
            Write-Output "PSScriptAnalyzer found $($findings.Count) issue(s) in scripts/."
            exit 1
          }
          Write-Output 'PSScriptAnalyzer: no findings in scripts/.'

  migrations:
    name: Database migrations apply to an empty database
    runs-on: ubuntu-latest
    # Proves the CORE-OPS-001 acceptance criterion: a fresh deploy's schema is
    # applied deterministically by the shipped migrations runner image
    # (apps/api/Migrations.Dockerfile) against an empty PostgreSQL database. This
    # gate is what an API rollout depends on; the API host never migrates on
    # startup (see docs/13_SELF_HOSTING_REQUIREMENTS.md, "Database migrations").
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livecore_migrations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No credentials in the repository: this is a throwaway CI database whose
      # password is defined here only for the ephemeral service container.
      MIGRATIONS_CONNECTION_STRING: "Host=localhost;Port=5432;Database=livecore_migrations_ci;Username=postgres;Password=postgres"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build migrations runner image
        run: docker build --file apps/api/Migrations.Dockerfile --tag livecore-migrations:ci .

      - name: Apply all migrations to the empty database
        run: |
          docker run --rm --network host \
            --env ConnectionStrings__Database="$MIGRATIONS_CONNECTION_STRING" \
            livecore-migrations:ci

      - name: Re-running the runner is an idempotent no-op
        run: |
          docker run --rm --network host \
            --env ConnectionStrings__Database="$MIGRATIONS_CONNECTION_STRING" \
            livecore-migrations:ci

  integration-postgres:
    name: Integration tests against PostgreSQL
    runs-on: ubuntu-latest
    # CORE-OPS-002: the integration suite defaults to in-memory SQLite with
    # EnsureCreated(), which builds the schema from the model and never touches the
    # checked-in migration files, so a broken or drifted PostgreSQL migration would
    # stay invisible. This job closes both gaps:
    #   1. a model-vs-migration drift gate (dotnet ef migrations
    #      has-pending-model-changes), and
    #   2. running the full integration suite against a real PostgreSQL, where each
    #      test's database schema is applied by the REAL migrations
    #      (Database.Migrate(), via a once-migrated template the per-test databases
    #      are copied from).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis/Valkey backplane for the cross-instance realtime propagation test (CORE-TST-003). The
      # documented production HA path makes the SignalR HubLifetimeManager Redis/Valkey-backed (CORE-OPS-007)
      # so a group send fans out to connections on every API instance; that was config-tested only. With this
      # service present, RedisBackplanePropagationTests boots multiple API instances against a real backplane
      # and proves cross-instance delivery and channel-prefix isolation. Valkey is the Redis-compatible
      # backplane docs/02_ARCHITECTURE.md names; StackExchange.Redis speaks the same protocol to either.
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Select the PostgreSQL provider for the integration suite and point it at the
      # ephemeral service container. No credential is committed: this is a throwaway
      # CI database whose password exists only for this service container, and the
      # suite creates and drops its own per-test databases against it.
      LIVECORE_TEST_DB_PROVIDER: Postgres
      LIVECORE_TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
      # The Redis/Valkey backplane the cross-instance propagation test runs against (CORE-TST-003). Absent
      # locally, so a default dotnet test skips that test; present here, so CI exercises real cross-instance
      # pub/sub. No credential committed: it points at the ephemeral service container above.
      LIVECORE_TEST_REDIS: "localhost:6379"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET local tools (dotnet-ef)
        run: dotnet tool restore

      - name: Restore the solution
        # dotnet ef retrieves project metadata through a design-time build that
        # does not restore implicitly, so without an explicit restore the next
        # step fails with NETSDK1004 (apps/api/obj/project.assets.json missing).
        # Restoring here also primes the integration test build below. Locked mode
        # keeps this leg's closure pinned to the committed lock files too (CORE-CMP-002).
        run: dotnet restore LiveCore.slnx --locked-mode

      - name: Fail on model-vs-migration drift
        # Returns non-zero when the EF Core model has changes not captured in a
        # migration, so model and migrations can never silently diverge. Builds
        # on the restore above (the EF tooling builds the project before checking).
        run: dotnet ef migrations has-pending-model-changes --project apps/api

      - name: Run integration suite against PostgreSQL
        run: dotnet test tests/LiveCore.Api.IntegrationTests/LiveCore.Api.IntegrationTests.csproj

  unit-smoke-postgres:
    name: Unit and smoke tests against PostgreSQL
    runs-on: ubuntu-latest
    # CORE-TST-004: the .NET `dotnet` job runs the whole solution on in-memory SQLite,
    # so the unit + smoke suites never exercised provider-specific behavior (collation,
    # case-sensitivity, JSON, the Npgsql-only xmin optimistic-concurrency token) on real
    # PostgreSQL — only the separate integration-postgres job used real Postgres, and
    # only for the integration project. This leg runs the unit and smoke suites against a
    # real PostgreSQL service with LIVECORE_TEST_DB_PROVIDER=Postgres set, so a
    # provider-divergent repository test (ProviderDivergentConcurrencyTests) runs on real
    # PostgreSQL and proves the cross-context concurrency conflict the SQLite path cannot.
    # The bulk of the SQLite-only unit tests still run here too (provider-agnostic
    # relational semantics), so nothing is lost; the Postgres-backed tests opt in through
    # the ProviderTestDatabase helper.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Select the PostgreSQL provider for the unit/smoke suites and point it at the
      # ephemeral service container. No credential is committed: this is a throwaway CI
      # database whose password exists only for this service container, and the suite
      # creates and drops its own per-test databases against it (threat T7).
      LIVECORE_TEST_DB_PROVIDER: Postgres
      LIVECORE_TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Run the unit suite against PostgreSQL
        run: dotnet test tests/LiveCore.Api.UnitTests/LiveCore.Api.UnitTests.csproj

      - name: Run the smoke suite against PostgreSQL
        run: dotnet test tests/LiveCore.SmokeTests/LiveCore.SmokeTests.csproj

  publish:
    name: Publish versioned container images
    runs-on: ubuntu-latest
    # CORE-OPS-009: publish only on a release tag push (never on a pull request
    # or a branch push), and only after every quality gate above has passed, so
    # an image is pushed only from a green, immutable, versioned release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - dotnet
      - coverage
      - typescript
      - boundary-scan
      - codeql
      - dependency-audit
      - spec-consistency
      - license-compliance
      - contributor-policy
      - changelog-completeness
      - migration-down-lint
      - storage-docs
      - action-pin-lint
      - log-redaction
      - backup-restore-drill
      - backup-restore-postgres
      - powershell-lint
      - docker
      - compose-smoke
      - compose-full-smoke
      - observability-assets
      - publish-dry-run
      - migrations
      - integration-postgres
      - unit-smoke-postgres
    permissions:
      # Least privilege: only this job may write packages; everything else keeps
      # the read-only top-level token. The GITHUB_TOKEN pushes to this repo's
      # GitHub Container Registry namespace - no registry credential is stored.
      contents: read
      packages: write
      # CORE-SEC-008: id-token: write is added to THIS publish job ONLY (the
      # workflow default is contents: read), so cosign can mint the short-lived
      # GitHub OIDC token for KEYLESS signing (Fulcio issues the certificate, Rekor
      # logs the entry). No signing key is ever stored, and no other job can
      # request an id-token.
      id-token: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Assert the release tag matches the packages' shared version (drift cannot ship)
        # CORE-CMP-003: fail the publish before building or pushing any image when
        # the release tag's version does not equal the four published packages'
        # shared version. The host images are versioned by this tag, so asserting
        # tag == package version keeps a release coherent (docs/23_PACKAGE_VERSIONING.md).
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
        run: ./scripts/assert-release-version.ps1 -Ref $env:GIT_REF

      - name: Derive immutable, versioned image references
        id: tags
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: ./scripts/derive-image-tags.ps1 -Ref $env:GIT_REF -Registry $env:REGISTRY -Owner $env:REPOSITORY_OWNER -OutputPath $env:GITHUB_OUTPUT

      - name: Install Trivy (SBOM generator and vulnerability scanner)
        # CORE-DEP-003: installs the Trivy CLI from its APT repository, mirroring
        # the dry-run job and the backup-restore-postgres client install, so no
        # extra GitHub Action enters the supply chain.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Install cosign (keyless image signing and SBOM attestation, CORE-SEC-008)
        # CORE-SEC-008: pinned release binary, the same "pin the tool, add no extra
        # GitHub Action to the supply chain" pattern as the Trivy install above.
        env:
          COSIGN_VERSION: v2.4.3
        run: |
          set -euo pipefail
          curl -fsSL -o cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          sudo install -m 0755 cosign /usr/local/bin/cosign
          rm -f cosign
          cosign version

      - name: Log in to the container registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin

      - name: Build the versioned API, worker and migrations images
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
          MIGRATIONS_REFERENCE: ${{ steps.tags.outputs.migrations }}
        run: |
          set -euo pipefail
          docker build --file apps/api/Dockerfile --build-arg SOURCE_REVISION="${{ github.sha }}" --tag "$API_REFERENCE" .
          docker build --file apps/worker/Dockerfile --build-arg SOURCE_REVISION="${{ github.sha }}" --tag "$WORKER_REFERENCE" .
          # CORE-OPS-015: the migrations runner shares the API assembly and is built
          # from apps/api/Migrations.Dockerfile, which declares no SOURCE_REVISION ARG
          # (this story is a release-tooling change only and does not modify that
          # Dockerfile), so it is built without the build-arg.
          docker build --file apps/api/Migrations.Dockerfile --tag "$MIGRATIONS_REFERENCE" .

      - name: Produce an SBOM and a CVE scan report, and fail the publish on a critical vulnerability
        # CORE-DEP-003: before anything is pushed, generate a CycloneDX SBOM and a
        # vulnerability scan report for each image, then run the supply-chain gate
        # in blocking mode. A CRITICAL finding (for example a known-CVE base image)
        # or a missing/empty SBOM fails the job here, so the release is never
        # pushed. The reports are uploaded as build artifacts below.
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
          MIGRATIONS_REFERENCE: ${{ steps.tags.outputs.migrations }}
        run: |
          set -euo pipefail
          for entry in "api=$API_REFERENCE" "worker=$WORKER_REFERENCE" "migrations=$MIGRATIONS_REFERENCE"; do
            name="${entry%%=*}"
            reference="${entry#*=}"
            trivy image --format cyclonedx --output "$name.sbom.cdx.json" "$reference"
            trivy image --format json --output "$name.scan.json" "$reference"
            pwsh -NoProfile -File scripts/assert-image-scan.ps1 \
              -ReportPath "$name.scan.json" -SbomPath "$name.sbom.cdx.json"
          done

      - name: Scan the SBOMs for disallowed/unknown licenses (CORE-LIC-003)
        # CORE-LIC-003: reuse the CycloneDX SBOM produced above and run the
        # fail-closed license gate over the published dependency closure. It starts
        # report-only - the staged report-only posture the coverage gate used
        # before it turned blocking (docs/17): the seeded gate-logic
        # test in the license-compliance job already proves it fails on a disallowed
        # or unknown license, and this records any not-yet-allow-listed license from
        # the first real published SBOM without blocking the initial releases. Drop
        # -ReportOnly to make a disallowed or unknown license block the publish once
        # the allow-list (scripts/LiveCoreLicenseCompliance.psm1) is validated against
        # the published closure.
        run: |
          set -euo pipefail
          for name in api worker migrations; do
            pwsh -NoProfile -File scripts/assert-license-compliance.ps1 \
              -SbomPath "$name.sbom.cdx.json" -ReportOnly
          done

      - name: Refuse to overwrite an already-published immutable tag, then push
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
          MIGRATIONS_REFERENCE: ${{ steps.tags.outputs.migrations }}
        run: |
          set -euo pipefail
          # Immutability guard: a release version is cut once, so an already
          # published tag must never be overwritten. Refuse to push when the tag
          # already exists in the registry rather than mutating a shipped image.
          for reference in "$API_REFERENCE" "$WORKER_REFERENCE" "$MIGRATIONS_REFERENCE"; do
            if docker manifest inspect "$reference" > /dev/null 2>&1; then
              echo "Refusing to overwrite an already-published immutable tag: $reference"
              exit 1
            fi
          done
          docker push "$API_REFERENCE"
          docker push "$WORKER_REFERENCE"
          docker push "$MIGRATIONS_REFERENCE"

      - name: Sign each pushed image and attach its CycloneDX SBOM as an attestation (keyless OIDC)
        # CORE-SEC-008: after the CVE gate passed and the images were pushed, sign
        # each PUBLISHED image keyless (Fulcio/Rekor via the job's OIDC id-token)
        # and attach its CycloneDX SBOM (produced above) as an in-toto attestation.
        # cosign stores the signature and the attestation in the registry alongside
        # the image's digest; no signing key is stored anywhere. The signature
        # binds to the digest, so it must run after the push.
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
          MIGRATIONS_REFERENCE: ${{ steps.tags.outputs.migrations }}
        run: |
          set -euo pipefail
          for entry in "api=$API_REFERENCE" "worker=$WORKER_REFERENCE" "migrations=$MIGRATIONS_REFERENCE"; do
            name="${entry%%=*}"
            reference="${entry#*=}"
            digest="$(docker inspect --format '{{ index .RepoDigests 0 }}' "$reference" | cut -d@ -f2)"
            pinned="${reference%:*}@$digest"
            echo "$name published digest: $digest"
            cosign sign --yes "$pinned"
            cosign attest --yes --predicate "$name.sbom.cdx.json" --type cyclonedx "$pinned"
          done

      - name: Verify the signature and SBOM attestation against the published digest (fail closed)
        # CORE-SEC-008: prove each published image is signed and SBOM-attested by
        # running cosign verify / verify-attestation against the published DIGEST,
        # asserting the GitHub Actions OIDC identity (this repo's release workflow)
        # and issuer, then running the fail-closed gate over the verification output
        # so an empty/unexpected result still blocks. This is the release-side of
        # the round-trip the publish-dry-run mirrors against a local digest.
        env:
          REPO: ${{ github.repository }}
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
          MIGRATIONS_REFERENCE: ${{ steps.tags.outputs.migrations }}
        run: |
          set -euo pipefail
          identity_regexp="^https://github.com/${REPO}/\.github/workflows/.+@refs/tags/v"
          issuer="https://token.actions.githubusercontent.com"
          for entry in "api=$API_REFERENCE" "worker=$WORKER_REFERENCE" "migrations=$MIGRATIONS_REFERENCE"; do
            name="${entry%%=*}"
            reference="${entry#*=}"
            digest="$(docker inspect --format '{{ index .RepoDigests 0 }}' "$reference" | cut -d@ -f2)"
            pinned="${reference%:*}@$digest"
            cosign verify \
              --certificate-identity-regexp "$identity_regexp" \
              --certificate-oidc-issuer "$issuer" \
              "$pinned" --output json > "$name.sig.json"
            cosign verify-attestation \
              --type cyclonedx \
              --certificate-identity-regexp "$identity_regexp" \
              --certificate-oidc-issuer "$issuer" \
              "$pinned" --output json > "$name.att.json"
            pwsh -NoProfile -File scripts/assert-image-attestation.ps1 \
              -SignatureVerificationPath "$name.sig.json" -AttestationVerificationPath "$name.att.json" -PredicateType cyclonedx
          done

      - name: Upload the published SBOMs, scan reports and attestation verifications
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-attestations
          path: |
            api.sbom.cdx.json
            api.scan.json
            api.sig.json
            api.att.json
            worker.sbom.cdx.json
            worker.scan.json
            worker.sig.json
            worker.att.json
            migrations.sbom.cdx.json
            migrations.scan.json
            migrations.sig.json
            migrations.att.json
          if-no-files-found: error

      - name: Summarize the published images
        env:
          REPO: ${{ github.repository }}
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
          MIGRATIONS_REFERENCE: ${{ steps.tags.outputs.migrations }}
        run: |
          {
            echo "### Published container images"
            echo ""
            echo "- \`$API_REFERENCE\`"
            echo "- \`$WORKER_REFERENCE\`"
            echo "- \`$MIGRATIONS_REFERENCE\`"
            echo ""
            echo "A CycloneDX SBOM and a CVE scan report were produced for each"
            echo "image and the critical-vulnerability gate passed before push."
            echo "Each pushed image is then **signed** (keyless cosign via the job's"
            echo "OIDC id-token) and its CycloneDX SBOM is attached as an"
            echo "**attestation**; \`cosign verify\` and \`cosign verify-attestation\`"
            echo "against the published digest passed before this job finished."
            echo ""
            echo "Verify a pulled image yourself (resolve \`<digest>\` with"
            echo "\`docker buildx imagetools inspect <image>:<tag>\`):"
            echo ""
            echo '```'
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp '^https://github.com/${REPO}/\\.github/workflows/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  <image>@<digest>"
            echo "cosign verify-attestation --type cyclonedx \\"
            echo "  --certificate-identity-regexp '^https://github.com/${REPO}/\\.github/workflows/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  <image>@<digest>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-packages:
    name: Publish the four @livecore packages to npm
    runs-on: ubuntu-latest
    # CORE-PUB-002: publish the four @livecore packages to the public npm registry
    # only on a release tag push (never on a pull request or a branch push), and
    # only after every quality gate above has passed, so a package version is
    # published only from a green, immutable, lockstepped release. The release
    # version gate refuses a tag that disagrees with the four packages' shared
    # version or packages out of lockstep, and the publish step refuses to
    # republish a version already on the registry (immutability).
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - dotnet
      - coverage
      - typescript
      - boundary-scan
      - codeql
      - dependency-audit
      - spec-consistency
      - license-compliance
      - contributor-policy
      - changelog-completeness
      - migration-down-lint
      - storage-docs
      - action-pin-lint
      - log-redaction
      - backup-restore-drill
      - backup-restore-postgres
      - powershell-lint
      - docker
      - compose-smoke
      - compose-full-smoke
      - observability-assets
      - publish-dry-run
      - publish-packages-dry-run
      - migrations
      - integration-postgres
      - unit-smoke-postgres
    permissions:
      # Least privilege: this job keeps the read-only repository token and uses NO
      # long-lived npm token. It publishes via npm TRUSTED PUBLISHING (OIDC): the npm
      # CLI exchanges the short-lived GitHub OIDC id-token for a one-time registry
      # publish credential, against the Trusted Publisher configured on each @livecore
      # package (CORE-PUB-002). id-token: write is the ONE added scope, granted to this
      # publish job only (the workflow default is contents: read), so no other job can
      # request an id-token; the same token mints the build-provenance attestation each
      # published @livecore/* version carries (CORE-PUB-004).
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable Corepack (pinned pnpm)
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert the release tag matches the packages' shared version (drift cannot ship)
        # CORE-PUB-002 / CORE-CMP-003: reuse the existing release-version gate so a
        # tag that disagrees with the four packages' shared version, packages out
        # of lockstep, or a non-release ref fail the publish before anything is
        # built or pushed.
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
        run: ./scripts/assert-release-version.ps1 -Ref $env:GIT_REF

      - name: Upgrade npm for OIDC trusted publishing
        # The real publish packs each package with pnpm (rewriting workspace:*) and
        # publishes the tarball with `npm publish`, because the OIDC trusted-publishing
        # token exchange is an npm CLI feature (>= 11.5.1) that pnpm's own publish does
        # not perform. Node 22 ships npm 10, so upgrade it here (CORE-PUB-002).
        run: npm install --global npm@latest

      - name: Build packages
        run: pnpm --recursive run build

      - name: Publish all four packages at the shared version (immutability + provenance)
        # CORE-PUB-002: build the fail-closed publish plan from the release tag and
        # publish each package at the shared lockstep version, refusing to
        # republish a version already on the registry (immutability). Registry and
        # public access come from each package's publishConfig
        # (docs/23_PACKAGE_VERSIONING.md).
        # CORE-PUB-004: the script publishes with --provenance, so each version
        # carries a verified npm build provenance attestation minted from this job's
        # scoped id-token; the registry verifies it against the package repository.url.
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
        run: ./scripts/publish-packages.ps1 -Ref $env:GIT_REF

      - name: Summarize the published packages
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          version="${GIT_REF#refs/tags/v}"
          {
            echo "### Published npm packages"
            echo ""
            echo "All four @livecore packages were published to the public npm"
            echo "registry at version \`$version\`:"
            echo ""
            echo "- \`@livecore/contracts@$version\`"
            echo "- \`@livecore/design-tokens@$version\`"
            echo "- \`@livecore/ui-core@$version\`"
            echo "- \`@livecore/sdk-ts@$version\`"
            echo ""
            echo "The release-version gate (tag == shared lockstep version) passed"
            echo "and a republish of an existing version was refused (immutability)."
            echo "Each version was published with npm build provenance"
            echo "(\`--provenance\`); verify with"
            echo "\`npm view @livecore/contracts@$version --json\` (a \`dist.attestations\`"
            echo "/ provenance block) or \`npm audit signatures\` in a consumer."
          } >> "$GITHUB_STEP_SUMMARY"
