# CI pipeline for livecore-platform (CORE-FND-003, docker job: CORE-FND-005).
#
# Runs the commands documented in README.md verbatim. Independent jobs:
#   dotnet               - build, smoke tests, format/code-style verification
#   typescript           - pnpm install, lint, format check, package builds/tests
#   boundary-scan        - forbidden vertical term scan (pwsh on Linux)
#   spec-consistency     - doc/csv route/table/event/epic consistency check (CORE-DOC-001)
#   backup-restore-drill - runnable restore drill over the systems of record (CORE-OPS-010)
#   powershell-lint      - PSScriptAnalyzer over scripts/*.ps1
#   docker               - image builds and container smoke tests (no push)
#   publish-dry-run      - verify image tags + dry-run build the publish path, no push (CORE-OPS-009)
#   migrations           - apply all migrations to an empty Postgres (CORE-OPS-001)
#   integration-postgres - drift gate + integration suite on real Postgres (CORE-OPS-002)
#   publish              - push immutable, versioned images on a release tag only (CORE-OPS-009)
#
# Every push and pull request runs the quality gates only. The publish job runs
# only on a release tag push ('v<MAJOR>.<MINOR>.<PATCH>') and only after every
# gate passes, so a registry push never happens on a pull request or a branch.
name: CI

on:
  push:
    branches: [main]
    # Release tags publish versioned container images (CORE-OPS-009). The same
    # push also runs every quality gate below; the publish job is gated on them.
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build, test and format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build LiveCore.slnx

      - name: Run smoke tests
        run: dotnet test LiveCore.slnx

      - name: Verify formatting and code style
        run: dotnet format LiveCore.slnx --verify-no-changes

  typescript:
    name: TypeScript lint, format and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pinned pnpm)
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Verify formatting
        run: pnpm run format:check

      - name: Build packages
        run: pnpm --recursive run build

      - name: Run package tests
        run: pnpm --recursive run test

  boundary-scan:
    name: Boundary scan (forbidden vertical terms)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run boundary scan
        run: pwsh -NoProfile -File scripts/boundary-scan.ps1

  spec-consistency:
    name: Spec consistency (routes/tables/events/epics)
    runs-on: ubuntu-latest
    # CORE-DOC-001: fails when the route, table, event or epic specifications in
    # docs/ and csv/ drift from each other or from their single source of truth
    # (see docs/24_SPEC_CONSISTENCY.md). Pure docs/csv check, no build needed.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run spec consistency check
        run: pwsh -NoProfile -File scripts/spec-consistency.ps1

  backup-restore-drill:
    name: Backup/restore drill (CORE-OPS-010)
    runs-on: ubuntu-latest
    # Runs the verifiably-runnable restore drill: a full backup -> restore ->
    # verify round-trip over a fixture modeling the append-only audit,
    # session-event and purchase systems of record, proving a faithful restore is
    # accepted and a lossy or tampered one is rejected fail-closed. No database or
    # object store needed (scripts/test-backup-restore-drill.ps1).
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run the backup/restore drill
        run: pwsh -NoProfile -File scripts/test-backup-restore-drill.ps1

  docker:
    name: Docker image builds and container smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag livecore-api:ci .

      - name: Build worker image
        run: docker build --file apps/worker/Dockerfile --tag livecore-worker:ci .

      - name: Smoke test API container (/health/live)
        run: |
          docker run --detach --name livecore-api-smoke --publish 8080:8080 livecore-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:8080/health/live; then
              echo "API container answered /health/live after $attempt attempt(s)."
              exit 0
            fi
            sleep 1
          done
          echo "API container did not answer /health/live in time."
          docker logs livecore-api-smoke
          exit 1

      - name: Smoke test worker container (clean startup)
        run: |
          docker run --detach --name livecore-worker-smoke livecore-worker:ci
          sleep 5
          status="$(docker inspect --format '{{.State.Status}}' livecore-worker-smoke)"
          docker logs livecore-worker-smoke
          if [ "$status" != "running" ]; then
            echo "Worker container is not running (status: $status)."
            exit 1
          fi
          echo "Worker container started and stayed running."

      - name: Clean up smoke test containers
        if: always()
        run: docker rm --force livecore-api-smoke livecore-worker-smoke || true

  publish-dry-run:
    name: Publish dry-run (tags verified, images built, never pushed)
    runs-on: ubuntu-latest
    # CORE-OPS-009: proves the publish path on every push and pull request
    # without ever pushing. It verifies the tag derivation (immutable, versioned,
    # fail-closed off a release tag) and, when this is not a release tag, builds
    # the images with the derived reference to dry-run the publish build. On a
    # release tag the build steps are skipped because the real publish job runs.
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify image tags are immutable and versioned
        shell: pwsh
        run: ./scripts/test-image-tags.ps1

      - name: Derive a release-shaped reference for the dry-run build
        id: tags
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          DRY_RUN_REF: refs/tags/v0.0.0-cidryrun
        run: ./scripts/derive-image-tags.ps1 -Ref $env:DRY_RUN_REF -Registry $env:REGISTRY -Owner $env:REPOSITORY_OWNER -OutputPath $env:GITHUB_OUTPUT

      - name: Dry-run build the API and worker images (built, never pushed)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
        run: |
          docker build --file apps/api/Dockerfile --tag "$API_REFERENCE" .
          docker build --file apps/worker/Dockerfile --tag "$WORKER_REFERENCE" .
          echo "Dry-run built $API_REFERENCE and $WORKER_REFERENCE; this job never logs in or pushes."

  powershell-lint:
    name: PowerShell script analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer on scripts/
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          # PSAvoidUsingWriteHost is excluded: the scan scripts are console
          # tools and Write-Host targets the host information stream by
          # design (PowerShell 5+).
          $findings = @(Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost)
          if ($findings.Count -gt 0) {
            $findings |
              Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize |
              Out-String -Width 220 |
              Write-Output
            Write-Output "PSScriptAnalyzer found $($findings.Count) issue(s) in scripts/."
            exit 1
          }
          Write-Output 'PSScriptAnalyzer: no findings in scripts/.'

  migrations:
    name: Database migrations apply to an empty database
    runs-on: ubuntu-latest
    # Proves the CORE-OPS-001 acceptance criterion: a fresh deploy's schema is
    # applied deterministically by the shipped migrations runner image
    # (apps/api/Migrations.Dockerfile) against an empty PostgreSQL database. This
    # gate is what an API rollout depends on; the API host never migrates on
    # startup (see docs/13_SELF_HOSTING_REQUIREMENTS.md, "Database migrations").
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livecore_migrations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No credentials in the repository: this is a throwaway CI database whose
      # password is defined here only for the ephemeral service container.
      MIGRATIONS_CONNECTION_STRING: "Host=localhost;Port=5432;Database=livecore_migrations_ci;Username=postgres;Password=postgres"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build migrations runner image
        run: docker build --file apps/api/Migrations.Dockerfile --tag livecore-migrations:ci .

      - name: Apply all migrations to the empty database
        run: |
          docker run --rm --network host \
            --env ConnectionStrings__Database="$MIGRATIONS_CONNECTION_STRING" \
            livecore-migrations:ci

      - name: Re-running the runner is an idempotent no-op
        run: |
          docker run --rm --network host \
            --env ConnectionStrings__Database="$MIGRATIONS_CONNECTION_STRING" \
            livecore-migrations:ci

  integration-postgres:
    name: Integration tests against PostgreSQL
    runs-on: ubuntu-latest
    # CORE-OPS-002: the integration suite defaults to in-memory SQLite with
    # EnsureCreated(), which builds the schema from the model and never touches the
    # checked-in migration files, so a broken or drifted PostgreSQL migration would
    # stay invisible. This job closes both gaps:
    #   1. a model-vs-migration drift gate (dotnet ef migrations
    #      has-pending-model-changes), and
    #   2. running the full integration suite against a real PostgreSQL, where each
    #      test's database schema is applied by the REAL migrations
    #      (Database.Migrate(), via a once-migrated template the per-test databases
    #      are copied from).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Select the PostgreSQL provider for the integration suite and point it at the
      # ephemeral service container. No credential is committed: this is a throwaway
      # CI database whose password exists only for this service container, and the
      # suite creates and drops its own per-test databases against it.
      LIVECORE_TEST_DB_PROVIDER: Postgres
      LIVECORE_TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET local tools (dotnet-ef)
        run: dotnet tool restore

      - name: Restore the solution
        # dotnet ef retrieves project metadata through a design-time build that
        # does not restore implicitly, so without an explicit restore the next
        # step fails with NETSDK1004 (apps/api/obj/project.assets.json missing).
        # Restoring here also primes the integration test build below.
        run: dotnet restore LiveCore.slnx

      - name: Fail on model-vs-migration drift
        # Returns non-zero when the EF Core model has changes not captured in a
        # migration, so model and migrations can never silently diverge. Builds
        # on the restore above (the EF tooling builds the project before checking).
        run: dotnet ef migrations has-pending-model-changes --project apps/api

      - name: Run integration suite against PostgreSQL
        run: dotnet test tests/LiveCore.Api.IntegrationTests/LiveCore.Api.IntegrationTests.csproj

  publish:
    name: Publish versioned container images
    runs-on: ubuntu-latest
    # CORE-OPS-009: publish only on a release tag push (never on a pull request
    # or a branch push), and only after every quality gate above has passed, so
    # an image is pushed only from a green, immutable, versioned release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - dotnet
      - typescript
      - boundary-scan
      - spec-consistency
      - backup-restore-drill
      - powershell-lint
      - docker
      - publish-dry-run
      - migrations
      - integration-postgres
    permissions:
      # Least privilege: only this job may write packages; everything else keeps
      # the read-only top-level token. The GITHUB_TOKEN pushes to this repo's
      # GitHub Container Registry namespace - no registry credential is stored.
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive immutable, versioned image references
        id: tags
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: ./scripts/derive-image-tags.ps1 -Ref $env:GIT_REF -Registry $env:REGISTRY -Owner $env:REPOSITORY_OWNER -OutputPath $env:GITHUB_OUTPUT

      - name: Log in to the container registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin

      - name: Build and push the versioned API and worker images
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
        run: |
          set -euo pipefail
          # Immutability guard: a release version is cut once, so an already
          # published tag must never be overwritten. Refuse to push when the tag
          # already exists in the registry rather than mutating a shipped image.
          for reference in "$API_REFERENCE" "$WORKER_REFERENCE"; do
            if docker manifest inspect "$reference" > /dev/null 2>&1; then
              echo "Refusing to overwrite an already-published immutable tag: $reference"
              exit 1
            fi
          done
          docker build --file apps/api/Dockerfile --tag "$API_REFERENCE" .
          docker build --file apps/worker/Dockerfile --tag "$WORKER_REFERENCE" .
          docker push "$API_REFERENCE"
          docker push "$WORKER_REFERENCE"

      - name: Summarize the published images
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
        run: |
          {
            echo "### Published container images"
            echo ""
            echo "- \`$API_REFERENCE\`"
            echo "- \`$WORKER_REFERENCE\`"
          } >> "$GITHUB_STEP_SUMMARY"
