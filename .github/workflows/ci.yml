# CI pipeline for livecore-platform (CORE-FND-003, docker job: CORE-FND-005).
#
# Runs the commands documented in README.md verbatim. Independent jobs:
#   dotnet               - locked-mode restore verification, build, the whole test suite on SQLite, format/code-style verification
#   coverage             - collect code coverage, report it, run the threshold gate (warn-only -> blocking, CORE-TST-001)
#   typescript           - pnpm install, lint, format check, package builds/tests, cross-package version lockstep (CORE-CMP-003)
#   boundary-scan        - forbidden vertical term scan (pwsh on Linux)
#   spec-consistency     - doc/csv route/table/event/epic consistency check (CORE-DOC-001)
#   migration-down-lint  - flag a destructive migration Down() (DropColumn/DropTable) for review (CORE-DR-004)
#   backup-restore-drill - runnable restore drill over the systems of record (CORE-OPS-010)
#   backup-restore-postgres - REAL backup/restore round-trip against live Postgres (CORE-DR-002)
#   powershell-lint      - PSScriptAnalyzer over scripts/*.ps1
#   docker               - image builds and container smoke tests (no push)
#   compose-smoke        - deployment manifest renders/starts + migrate gate (CORE-DEP-001)
#   publish-dry-run      - verify image tags + image-scan gate test + release-tag-vs-package-version gate test + dry-run build, SBOM and CVE scan, no push (CORE-OPS-009, CORE-DEP-003, CORE-CMP-003)
#   migrations           - apply all migrations to an empty Postgres (CORE-OPS-001)
#   integration-postgres - drift gate + integration suite on real Postgres (CORE-OPS-002); also runs the cross-instance Redis/Valkey backplane propagation test against a Redis service (CORE-TST-003)
#   unit-smoke-postgres  - run the unit + smoke suites against real Postgres so provider-specific behavior is exercised (CORE-TST-004)
#   publish              - assert release tag == package version (CORE-CMP-003), SBOM + CVE scan (fail on critical), then push immutable, versioned images on a release tag only (CORE-OPS-009, CORE-DEP-003)
#
# Every push and pull request runs the quality gates only. The publish job runs
# only on a release tag push ('v<MAJOR>.<MINOR>.<PATCH>') and only after every
# gate passes, so a registry push never happens on a pull request or a branch.
name: CI

on:
  push:
    branches: [main]
    # Release tags publish versioned container images (CORE-OPS-009). The same
    # push also runs every quality gate below; the publish job is gated on them.
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build, test and format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify locked restore (committed lock files match the resolved graph)
        # CORE-CMP-002: restore the whole solution in locked mode so CI fails if any
        # committed packages.lock.json drifts from the graph the .csproj files resolve.
        # The release images restore in this same locked mode (apps/api/Dockerfile,
        # apps/worker/Dockerfile, apps/api/Migrations.Dockerfile), so gating CI on it
        # guarantees the dependency closure CI builds and tests against is exactly the
        # one a published image restores - the two can never silently diverge.
        run: dotnet restore LiveCore.slnx --locked-mode

      - name: Build solution
        run: dotnet build LiveCore.slnx

      - name: Run the test suite (unit, smoke and integration on SQLite)
        # dotnet test on the whole solution runs the unit AND smoke AND integration
        # test projects; with no Postgres service and LIVECORE_TEST_DB_PROVIDER unset
        # they all run on in-memory SQLite. This step used to be mislabeled "Run smoke
        # tests" (CORE-TST-004); the matching real-Postgres leg is the
        # unit-smoke-postgres and integration-postgres jobs below.
        run: dotnet test LiveCore.slnx

      - name: Verify formatting and code style
        run: dotnet format LiveCore.slnx --verify-no-changes

  coverage:
    name: Code coverage (collect, report, gate)
    runs-on: ubuntu-latest
    # CORE-TST-001: coverlet.collector is referenced by every test project, but no
    # step collected coverage or gated on it, so the strong test coverage was
    # unguarded - a new untested production handler could silently regress it and
    # the "no feature without tests" Definition of Done rested on author
    # discipline alone (docs/14, docs/17). This job closes that gap:
    #   1. it unit-tests the gate logic first (a seeded, deliberately-untested new
    #      handler trips the threshold once blocking is enabled),
    #   2. collects coverage with the already-referenced collector (no new
    #      dependency) - one coverage.cobertura.xml per test project,
    #   3. uploads the reports as a build artifact, and
    #   4. runs the threshold gate over the merged, de-duplicated,
    #      production-focused number (test assemblies and generated EF migrations
    #      excluded; see scripts/LiveCoreCoverage.psm1).
    # The gate STARTS NON-BLOCKING (assert-coverage.ps1 -ReportOnly): it reports
    # coverage and warns on a regression below the minimum without failing the
    # build. It is flipped to BLOCKING by dropping -ReportOnly once the team is
    # ready, exactly like the supply-chain dry-run's report-only posture.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test the coverage gate logic (a seeded untested handler trips it)
        run: pwsh -NoProfile -File scripts/test-coverage-gate.ps1

      - name: Run the test suite with coverage collection
        run: dotnet test LiveCore.slnx --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload the coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: "TestResults/**/coverage.cobertura.xml"
          if-no-files-found: error

      - name: Report coverage and run the threshold gate (non-blocking for now)
        # Drop -ReportOnly to make a coverage regression below the minimum fail
        # the build (the blocking posture). Raise -MinimumLineCoverage toward the
        # current production coverage as the team ratchets the floor up.
        run: pwsh -NoProfile -File scripts/assert-coverage.ps1 -ReportDirectory ./TestResults -MinimumLineCoverage 80 -ReportOnly

  typescript:
    name: TypeScript lint, format and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pinned pnpm)
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Verify formatting
        run: pnpm run format:check

      - name: Build packages
        run: pnpm --recursive run build

      - name: Run package tests
        run: pnpm --recursive run test

      - name: Cross-package version lockstep test (CORE-CMP-003)
        # The per-package build tests check each package's OWN version triple;
        # this asserts the four packages share ONE version across package.json,
        # the exported VERSION and every changelog (incl. the root CHANGELOG), so
        # bumping one package out of lockstep fails CI (docs/23_PACKAGE_VERSIONING.md).
        run: pnpm run test:versions

  boundary-scan:
    name: Boundary scan (forbidden vertical terms)
    runs-on: ubuntu-latest
    # CORE-BND-001: the scanner enumerates TRACKED source only (git ls-files), so
    # gitignored tooling is excluded, *.Dockerfile is in scope, and the docs/ and
    # csv/ trees plus the root documentation files are excluded. The test step
    # proves that coverage over a throwaway git work tree (a seeded brand term in
    # a tracked .cs/Dockerfile is flagged, gitignored and documentation files are
    # not, and a non-git tree fails closed), then guards the real tree.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test the boundary scan logic
        run: pwsh -NoProfile -File scripts/test-boundary-scan.ps1

      - name: Run boundary scan
        run: pwsh -NoProfile -File scripts/boundary-scan.ps1

  spec-consistency:
    name: Spec consistency (routes/tables/events/epics)
    runs-on: ubuntu-latest
    # CORE-DOC-001 + CORE-SPEC-001: fails when the route, table, event or epic
    # specifications in docs/ and csv/ drift from each other, from their single
    # source of truth (see docs/24_SPEC_CONSISTENCY.md) OR from the implementation
    # (the minimal-API registrations + the EF model snapshot). Pure source check,
    # no build needed.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test the spec consistency check logic
        run: pwsh -NoProfile -File scripts/test-spec-consistency.ps1

      - name: Run spec consistency check
        run: pwsh -NoProfile -File scripts/spec-consistency.ps1

  migration-down-lint:
    name: Migration Down() review (CORE-DR-004)
    runs-on: ubuntu-latest
    # CORE-DR-004: migrations are roll-forward-only - a Down() is never run in
    # production because every one drops the table/column its Up() added. This
    # lint flags any migration whose Down() drops a table or column so a new
    # destructive Down() cannot merge without being reviewed and acknowledged in
    # csv/migration_destructive_down_review.csv under the documented policy
    # (docs/13_SELF_HOSTING_REQUIREMENTS.md, "Migration rollback policy"). Pure
    # docs/scripts check, no build needed.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test the destructive-Down lint logic
        run: pwsh -NoProfile -File scripts/test-migration-down-lint.ps1

      - name: Flag any unreviewed destructive migration Down()
        run: pwsh -NoProfile -File scripts/lint-migration-downs.ps1

  backup-restore-drill:
    name: Backup/restore drill (CORE-OPS-010)
    runs-on: ubuntu-latest
    # Runs the verifiably-runnable restore drill: a full backup -> restore ->
    # verify round-trip over a fixture modeling the append-only audit,
    # session-event and purchase systems of record, proving a faithful restore is
    # accepted and a lossy or tampered one is rejected fail-closed. No database or
    # object store needed (scripts/test-backup-restore-drill.ps1).
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run the backup/restore drill
        run: pwsh -NoProfile -File scripts/test-backup-restore-drill.ps1

  backup-restore-postgres:
    name: Real backup/restore round-trip on PostgreSQL (CORE-DR-002)
    runs-on: ubuntu-latest
    # CORE-DR-002: the backup-restore-drill job above proves the coverage and
    # integrity LOGIC with an in-memory fixture, but the real backup-livecore.ps1 /
    # restore-livecore.ps1 - the scripts that actually invoke pg_dump / pg_restore /
    # psql and the to_jsonb content checksum - were never run against a real
    # PostgreSQL, so a broken tool argument would ship green and the RTO/RPO claims
    # would rest on an untested path. This job runs the REAL scripts end to end
    # against the same Postgres service the migrations/integration-postgres jobs use:
    # it seeds the systems-of-record tables, backs them up, restores into a FRESH
    # database and asserts the full backup -> restore -> integrity round-trip
    # (real pg_dump/pg_restore/psql + to_jsonb row-count/checksum) passes.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livecore_backup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No credentials in the repository: these are throwaway CI databases whose
      # password exists only for the ephemeral service container.
      SOURCE_CONNECTION_STRING: "Host=localhost;Port=5432;Database=livecore_backup_ci;Username=postgres;Password=postgres"
      RESTORE_CONNECTION_STRING: "Host=localhost;Port=5432;Database=livecore_restore_ci;Username=postgres;Password=postgres"
      # Backups are encrypted at rest (CORE-DR-001), so the scripts refuse to run
      # without a passphrase. This is a throwaway CI-only value, never a real secret.
      Backup__Encryption__Passphrase: "ci-backup-restore-roundtrip-passphrase"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install the PostgreSQL 17 client (matching pg_dump/pg_restore/psql)
        # The runner's bundled client may be older than the postgres:17 service, and
        # pg_dump refuses to dump a newer server. Install the matching major and put
        # it first on PATH so the scripts' default pg_dump/pg_restore/psql resolve to
        # version 17.
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Build migrations runner image
        run: docker build --file apps/api/Migrations.Dockerfile --tag livecore-migrations:ci .

      - name: Apply the real migrations to the source database
        run: |
          docker run --rm --network host \
            --env ConnectionStrings__Database="$SOURCE_CONNECTION_STRING" \
            livecore-migrations:ci

      - name: Run the real backup -> restore -> integrity round-trip
        run: |
          pwsh -NoProfile -File scripts/test-backup-restore-postgres.ps1 \
            -SourceConnectionString "$SOURCE_CONNECTION_STRING" \
            -RestoreConnectionString "$RESTORE_CONNECTION_STRING"

  docker:
    name: Docker image builds and container smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag livecore-api:ci .

      - name: Build worker image
        run: docker build --file apps/worker/Dockerfile --tag livecore-worker:ci .

      - name: Smoke test API container (/health/live)
        run: |
          docker run --detach --name livecore-api-smoke --publish 8080:8080 livecore-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:8080/health/live; then
              echo "API container answered /health/live after $attempt attempt(s)."
              exit 0
            fi
            sleep 1
          done
          echo "API container did not answer /health/live in time."
          docker logs livecore-api-smoke
          exit 1

      - name: Smoke test worker container (clean startup)
        run: |
          docker run --detach --name livecore-worker-smoke livecore-worker:ci
          sleep 5
          status="$(docker inspect --format '{{.State.Status}}' livecore-worker-smoke)"
          docker logs livecore-worker-smoke
          if [ "$status" != "running" ]; then
            echo "Worker container is not running (status: $status)."
            exit 1
          fi
          echo "Worker container started and stayed running."

      - name: Clean up smoke test containers
        if: always()
        run: docker rm --force livecore-api-smoke livecore-worker-smoke || true

  compose-smoke:
    name: Deployment manifest smoke (CORE-DEP-001)
    runs-on: ubuntu-latest
    # CORE-DEP-001: the in-repo deployment manifest (deploy/compose/docker-compose.yml)
    # must let an operator deploy from this repo alone. The two easy-to-get-wrong
    # pieces - the migrate-before-API ordering (depends_on:
    # service_completed_successfully) and the heartbeat liveness probe - used to
    # exist only as prose. This job proves both:
    #   1. RENDERS/VALIDATES: a no-Docker static check (scripts/test-compose-deploy.ps1)
    #      that the manifest wires the migrate gate, the postgres healthcheck, all
    #      four services and the documented probes, plus `docker compose config`.
    #   2. STARTS + GATE: brings the stack up against Docker and asserts the
    #      migrations runner exits 0, the API and worker start ONLY AFTER it
    #      completes (the gate), and the documented health/readiness/liveness
    #      endpoints answer 200.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate the compose manifest (gate + probes, no Docker)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-compose-deploy.ps1

      - name: Render the compose manifest
        run: docker compose -f deploy/compose/docker-compose.yml config

      - name: Start the stack (postgres -> migrate gate -> api + worker)
        working-directory: deploy/compose
        run: docker compose up -d --build

      - name: The migrations runner ran to completion (exit 0)
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          migrate_cid="$(docker compose ps -aq migrate)"
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$migrate_cid")"
          echo "migrate exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            docker compose logs migrate
            echo "Migrations runner did not exit 0."
            exit 1
          fi

      - name: The migrate gate blocked API/worker start until migrations completed
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          migrate_cid="$(docker compose ps -aq migrate)"
          api_cid="$(docker compose ps -aq api)"
          worker_cid="$(docker compose ps -aq worker)"
          migrate_finished="$(date -d "$(docker inspect -f '{{.State.FinishedAt}}' "$migrate_cid")" +%s%N)"
          api_started="$(date -d "$(docker inspect -f '{{.State.StartedAt}}' "$api_cid")" +%s%N)"
          worker_started="$(date -d "$(docker inspect -f '{{.State.StartedAt}}' "$worker_cid")" +%s%N)"
          echo "migrate finished (ns): $migrate_finished"
          echo "api started (ns):      $api_started"
          echo "worker started (ns):   $worker_started"
          if [ "$api_started" -lt "$migrate_finished" ] || [ "$worker_started" -lt "$migrate_finished" ]; then
            echo "GATE VIOLATION: API or worker started before migrations completed."
            exit 1
          fi
          echo "Gate held: API and worker started only after the migrations runner completed."

      - name: The documented health/readiness/liveness probes answer 200
        run: |
          set -euo pipefail
          probe() {
            local url="$1"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --output /dev/null "$url"; then
                echo "OK: $url answered after $attempt attempt(s)."
                return 0
              fi
              sleep 1
            done
            echo "FAILED: $url did not answer 200 in time."
            return 1
          }
          probe http://localhost:8080/health/live    # API liveness
          probe http://localhost:8080/health/ready    # API readiness
          probe http://localhost:9464/health/live     # worker per-loop heartbeat liveness
          probe http://localhost:9464/metrics         # worker Prometheus scrape

      - name: Dump container logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v --remove-orphans || true

  publish-dry-run:
    name: Publish dry-run (tags verified, images built, never pushed)
    runs-on: ubuntu-latest
    # CORE-OPS-009: proves the publish path on every push and pull request
    # without ever pushing. It verifies the tag derivation (immutable, versioned,
    # fail-closed off a release tag) and, when this is not a release tag, builds
    # the images with the derived reference to dry-run the publish build. On a
    # release tag the build steps are skipped because the real publish job runs.
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify image tags are immutable and versioned
        shell: pwsh
        run: ./scripts/test-image-tags.ps1

      - name: Test the image scan gate and SBOM validation logic (seeded critical CVE fails)
        # CORE-DEP-003: proves deterministically, with no Docker/registry, that a
        # seeded CRITICAL vulnerability blocks the publish, the failing severities
        # are configurable and only a usable SBOM is accepted. This is the
        # required "a seeded critical CVE fails the gate" test, run every push/PR.
        shell: pwsh
        run: ./scripts/test-image-scan.ps1

      - name: Test the release-tag-vs-package-version gate (a mismatching tag fails)
        # CORE-CMP-003: proves the publish gate logic with no registry I/O - a
        # release tag matching the four packages' shared version passes, and a
        # mismatching tag (or the packages out of lockstep) fails closed. This is
        # the required "a release tag mismatching the package version fails the
        # publish gate" test, run on every push and pull request; the real gate
        # runs against the actual tag in the publish job below.
        shell: pwsh
        run: ./scripts/test-release-version.ps1

      - name: Derive a release-shaped reference for the dry-run build
        id: tags
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          DRY_RUN_REF: refs/tags/v0.0.0-cidryrun
        run: ./scripts/derive-image-tags.ps1 -Ref $env:DRY_RUN_REF -Registry $env:REGISTRY -Owner $env:REPOSITORY_OWNER -OutputPath $env:GITHUB_OUTPUT

      - name: Dry-run build the API and worker images (built, never pushed)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
        run: |
          docker build --file apps/api/Dockerfile --tag "$API_REFERENCE" .
          docker build --file apps/worker/Dockerfile --tag "$WORKER_REFERENCE" .
          echo "Dry-run built $API_REFERENCE and $WORKER_REFERENCE; this job never logs in or pushes."

      - name: Install Trivy (SBOM generator and vulnerability scanner)
        # CORE-DEP-003: installs the Trivy CLI from its APT repository (the same
        # pattern the backup-restore-postgres job uses for the PostgreSQL client),
        # so no extra GitHub Action enters the supply chain.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Produce an SBOM and a CVE scan report for the dry-run images
        # CORE-DEP-003 required test: the publish dry-run produces an SBOM and a
        # scan report. The gate runs report-only here, so a transient base-image
        # CVE documents itself on a pull request without blocking development -
        # the release publish job runs the same gate for real.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
        run: |
          set -euo pipefail
          for entry in "api=$API_REFERENCE" "worker=$WORKER_REFERENCE"; do
            name="${entry%%=*}"
            reference="${entry#*=}"
            trivy image --format cyclonedx --output "$name.sbom.cdx.json" "$reference"
            trivy image --format json --output "$name.scan.json" "$reference"
            pwsh -NoProfile -File scripts/assert-image-scan.ps1 \
              -ReportPath "$name.scan.json" -SbomPath "$name.sbom.cdx.json" -ReportOnly
          done

      - name: Upload the dry-run SBOMs and scan reports
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-dry-run
          path: |
            api.sbom.cdx.json
            api.scan.json
            worker.sbom.cdx.json
            worker.scan.json
          if-no-files-found: error

  powershell-lint:
    name: PowerShell script analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer on scripts/
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          # Excluded rules (with rationale):
          # - PSAvoidUsingWriteHost: the scan/backup scripts are console tools and
          #   Write-Host targets the host information stream by design (PowerShell 5+).
          # - PSAvoidUsingPlainTextForPassword: the backup-encryption passphrase and
          #   database password are interfaces to PBKDF2/external tooling; PowerShell
          #   must materialize them as bytes to derive the key, so a SecureString
          #   would be converted straight back to plaintext. The -*PassphraseFile
          #   parameters are the recommended secure path (CORE-DR-001).
          # - PSUseSingularNouns: the crypto helpers use deliberately descriptive
          #   plural nouns (Test-LiveCoreFixedTimeEquals mirrors .NET
          #   CryptographicOperations.FixedTimeEquals; Read-LiveCoreExactBytes);
          #   singularizing them would make the names misleading.
          $findings = @(Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost, PSAvoidUsingPlainTextForPassword, PSUseSingularNouns)
          if ($findings.Count -gt 0) {
            $findings |
              Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize |
              Out-String -Width 220 |
              Write-Output
            Write-Output "PSScriptAnalyzer found $($findings.Count) issue(s) in scripts/."
            exit 1
          }
          Write-Output 'PSScriptAnalyzer: no findings in scripts/.'

  migrations:
    name: Database migrations apply to an empty database
    runs-on: ubuntu-latest
    # Proves the CORE-OPS-001 acceptance criterion: a fresh deploy's schema is
    # applied deterministically by the shipped migrations runner image
    # (apps/api/Migrations.Dockerfile) against an empty PostgreSQL database. This
    # gate is what an API rollout depends on; the API host never migrates on
    # startup (see docs/13_SELF_HOSTING_REQUIREMENTS.md, "Database migrations").
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livecore_migrations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No credentials in the repository: this is a throwaway CI database whose
      # password is defined here only for the ephemeral service container.
      MIGRATIONS_CONNECTION_STRING: "Host=localhost;Port=5432;Database=livecore_migrations_ci;Username=postgres;Password=postgres"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build migrations runner image
        run: docker build --file apps/api/Migrations.Dockerfile --tag livecore-migrations:ci .

      - name: Apply all migrations to the empty database
        run: |
          docker run --rm --network host \
            --env ConnectionStrings__Database="$MIGRATIONS_CONNECTION_STRING" \
            livecore-migrations:ci

      - name: Re-running the runner is an idempotent no-op
        run: |
          docker run --rm --network host \
            --env ConnectionStrings__Database="$MIGRATIONS_CONNECTION_STRING" \
            livecore-migrations:ci

  integration-postgres:
    name: Integration tests against PostgreSQL
    runs-on: ubuntu-latest
    # CORE-OPS-002: the integration suite defaults to in-memory SQLite with
    # EnsureCreated(), which builds the schema from the model and never touches the
    # checked-in migration files, so a broken or drifted PostgreSQL migration would
    # stay invisible. This job closes both gaps:
    #   1. a model-vs-migration drift gate (dotnet ef migrations
    #      has-pending-model-changes), and
    #   2. running the full integration suite against a real PostgreSQL, where each
    #      test's database schema is applied by the REAL migrations
    #      (Database.Migrate(), via a once-migrated template the per-test databases
    #      are copied from).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis/Valkey backplane for the cross-instance realtime propagation test (CORE-TST-003). The
      # documented production HA path makes the SignalR HubLifetimeManager Redis/Valkey-backed (CORE-OPS-007)
      # so a group send fans out to connections on every API instance; that was config-tested only. With this
      # service present, RedisBackplanePropagationTests boots multiple API instances against a real backplane
      # and proves cross-instance delivery and channel-prefix isolation. Valkey is the Redis-compatible
      # backplane docs/02_ARCHITECTURE.md names; StackExchange.Redis speaks the same protocol to either.
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Select the PostgreSQL provider for the integration suite and point it at the
      # ephemeral service container. No credential is committed: this is a throwaway
      # CI database whose password exists only for this service container, and the
      # suite creates and drops its own per-test databases against it.
      LIVECORE_TEST_DB_PROVIDER: Postgres
      LIVECORE_TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
      # The Redis/Valkey backplane the cross-instance propagation test runs against (CORE-TST-003). Absent
      # locally, so a default dotnet test skips that test; present here, so CI exercises real cross-instance
      # pub/sub. No credential committed: it points at the ephemeral service container above.
      LIVECORE_TEST_REDIS: "localhost:6379"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET local tools (dotnet-ef)
        run: dotnet tool restore

      - name: Restore the solution
        # dotnet ef retrieves project metadata through a design-time build that
        # does not restore implicitly, so without an explicit restore the next
        # step fails with NETSDK1004 (apps/api/obj/project.assets.json missing).
        # Restoring here also primes the integration test build below. Locked mode
        # keeps this leg's closure pinned to the committed lock files too (CORE-CMP-002).
        run: dotnet restore LiveCore.slnx --locked-mode

      - name: Fail on model-vs-migration drift
        # Returns non-zero when the EF Core model has changes not captured in a
        # migration, so model and migrations can never silently diverge. Builds
        # on the restore above (the EF tooling builds the project before checking).
        run: dotnet ef migrations has-pending-model-changes --project apps/api

      - name: Run integration suite against PostgreSQL
        run: dotnet test tests/LiveCore.Api.IntegrationTests/LiveCore.Api.IntegrationTests.csproj

  unit-smoke-postgres:
    name: Unit and smoke tests against PostgreSQL
    runs-on: ubuntu-latest
    # CORE-TST-004: the .NET `dotnet` job runs the whole solution on in-memory SQLite,
    # so the unit + smoke suites never exercised provider-specific behavior (collation,
    # case-sensitivity, JSON, the Npgsql-only xmin optimistic-concurrency token) on real
    # PostgreSQL — only the separate integration-postgres job used real Postgres, and
    # only for the integration project. This leg runs the unit and smoke suites against a
    # real PostgreSQL service with LIVECORE_TEST_DB_PROVIDER=Postgres set, so a
    # provider-divergent repository test (ProviderDivergentConcurrencyTests) runs on real
    # PostgreSQL and proves the cross-context concurrency conflict the SQLite path cannot.
    # The bulk of the SQLite-only unit tests still run here too (provider-agnostic
    # relational semantics), so nothing is lost; the Postgres-backed tests opt in through
    # the ProviderTestDatabase helper.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Select the PostgreSQL provider for the unit/smoke suites and point it at the
      # ephemeral service container. No credential is committed: this is a throwaway CI
      # database whose password exists only for this service container, and the suite
      # creates and drops its own per-test databases against it (threat T7).
      LIVECORE_TEST_DB_PROVIDER: Postgres
      LIVECORE_TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run the unit suite against PostgreSQL
        run: dotnet test tests/LiveCore.Api.UnitTests/LiveCore.Api.UnitTests.csproj

      - name: Run the smoke suite against PostgreSQL
        run: dotnet test tests/LiveCore.SmokeTests/LiveCore.SmokeTests.csproj

  publish:
    name: Publish versioned container images
    runs-on: ubuntu-latest
    # CORE-OPS-009: publish only on a release tag push (never on a pull request
    # or a branch push), and only after every quality gate above has passed, so
    # an image is pushed only from a green, immutable, versioned release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - dotnet
      - coverage
      - typescript
      - boundary-scan
      - spec-consistency
      - migration-down-lint
      - backup-restore-drill
      - backup-restore-postgres
      - powershell-lint
      - docker
      - compose-smoke
      - publish-dry-run
      - migrations
      - integration-postgres
      - unit-smoke-postgres
    permissions:
      # Least privilege: only this job may write packages; everything else keeps
      # the read-only top-level token. The GITHUB_TOKEN pushes to this repo's
      # GitHub Container Registry namespace - no registry credential is stored.
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assert the release tag matches the packages' shared version (drift cannot ship)
        # CORE-CMP-003: fail the publish before building or pushing any image when
        # the release tag's version does not equal the four published packages'
        # shared version. The host images are versioned by this tag, so asserting
        # tag == package version keeps a release coherent (docs/23_PACKAGE_VERSIONING.md).
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
        run: ./scripts/assert-release-version.ps1 -Ref $env:GIT_REF

      - name: Derive immutable, versioned image references
        id: tags
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: ./scripts/derive-image-tags.ps1 -Ref $env:GIT_REF -Registry $env:REGISTRY -Owner $env:REPOSITORY_OWNER -OutputPath $env:GITHUB_OUTPUT

      - name: Install Trivy (SBOM generator and vulnerability scanner)
        # CORE-DEP-003: installs the Trivy CLI from its APT repository, mirroring
        # the dry-run job and the backup-restore-postgres client install, so no
        # extra GitHub Action enters the supply chain.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Log in to the container registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin

      - name: Build the versioned API and worker images
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
        run: |
          set -euo pipefail
          docker build --file apps/api/Dockerfile --tag "$API_REFERENCE" .
          docker build --file apps/worker/Dockerfile --tag "$WORKER_REFERENCE" .

      - name: Produce an SBOM and a CVE scan report, and fail the publish on a critical vulnerability
        # CORE-DEP-003: before anything is pushed, generate a CycloneDX SBOM and a
        # vulnerability scan report for each image, then run the supply-chain gate
        # in blocking mode. A CRITICAL finding (for example a known-CVE base image)
        # or a missing/empty SBOM fails the job here, so the release is never
        # pushed. The reports are uploaded as build artifacts below.
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
        run: |
          set -euo pipefail
          for entry in "api=$API_REFERENCE" "worker=$WORKER_REFERENCE"; do
            name="${entry%%=*}"
            reference="${entry#*=}"
            trivy image --format cyclonedx --output "$name.sbom.cdx.json" "$reference"
            trivy image --format json --output "$name.scan.json" "$reference"
            pwsh -NoProfile -File scripts/assert-image-scan.ps1 \
              -ReportPath "$name.scan.json" -SbomPath "$name.sbom.cdx.json"
          done

      - name: Refuse to overwrite an already-published immutable tag, then push
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
        run: |
          set -euo pipefail
          # Immutability guard: a release version is cut once, so an already
          # published tag must never be overwritten. Refuse to push when the tag
          # already exists in the registry rather than mutating a shipped image.
          for reference in "$API_REFERENCE" "$WORKER_REFERENCE"; do
            if docker manifest inspect "$reference" > /dev/null 2>&1; then
              echo "Refusing to overwrite an already-published immutable tag: $reference"
              exit 1
            fi
          done
          docker push "$API_REFERENCE"
          docker push "$WORKER_REFERENCE"

      - name: Upload the published SBOMs and scan reports
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-attestations
          path: |
            api.sbom.cdx.json
            api.scan.json
            worker.sbom.cdx.json
            worker.scan.json
          if-no-files-found: error

      - name: Summarize the published images
        env:
          API_REFERENCE: ${{ steps.tags.outputs.api }}
          WORKER_REFERENCE: ${{ steps.tags.outputs.worker }}
        run: |
          {
            echo "### Published container images"
            echo ""
            echo "- \`$API_REFERENCE\`"
            echo "- \`$WORKER_REFERENCE\`"
            echo ""
            echo "A CycloneDX SBOM and a CVE scan report were produced for each"
            echo "image and the critical-vulnerability gate passed before push"
            echo "(see the \`supply-chain-attestations\` build artifact)."
          } >> "$GITHUB_STEP_SUMMARY"
